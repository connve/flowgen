{{- $worker := index .Values "flowgen" -}}
{{- if and $worker.enabled (not $worker.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowgen.fullname" . }}-config
  labels:
    {{- include "flowgen.labels" . | nindent 4 }}
data:
  config.yaml: |
{{- include "flowgen.settings" . | nindent 4 }}
{{- end }}
