{{- $worker := index .Values "flowgen" -}}
{{- if $worker.enabled }}
{{- $root := . -}}
{{- range $key, $server := include "flowgen.servers" . | fromYaml }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgen.fullname" $root }}-{{ $key | replace "_" "-" }}
  labels:
    {{- include "flowgen.labels" $root | nindent 4 }}
spec:
  type: {{ $server.type }}
  selector:
    {{- include "flowgen.selectorLabels" $root | nindent 4 }}
  ports:
  - port: {{ $server.port }}
    targetPort: {{ $server.name }}
    protocol: TCP
    name: {{ $server.name }}
{{- end }}
{{- end }}
