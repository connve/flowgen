{{- $worker := index .Values "flowgen" -}}
{{- if and $worker.enabled $worker.cluster $worker.cluster.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flowgen.fullname" . }}
  labels:
    {{- include "flowgen.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flowgen.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "flowgen.selectorLabels" . | nindent 10 }}
    ports:
    - port: {{ dig "telemetry" "backend" "port" 8082 (include "flowgen.settings" . | fromYaml) }}
      protocol: TCP
  - ports:
    {{- range $key, $server := include "flowgen.servers" . | fromYaml }}
    - port: {{ $server.port }}
      protocol: TCP
    {{- end }}
    - port: {{ dig "health" "port" 8081 (include "flowgen.settings" . | fromYaml) }}
      protocol: TCP
{{- end }}
