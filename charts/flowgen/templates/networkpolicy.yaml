{{- $worker := index .Values "flowgen" -}}
{{- if and $worker.enabled $worker.cluster $worker.cluster.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flowgen.fullname" . }}
  labels:
    {{- include "flowgen.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flowgen.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "flowgen.selectorLabels" . | nindent 10 }}
    ports:
    - port: {{ default 8082 $worker.cluster.port }}
      protocol: TCP
  - ports:
    {{- if $worker.http_server }}
    - port: {{ $worker.http_server.port }}
      protocol: TCP
    {{- end }}
    {{- if $worker.mcp_server }}
    - port: {{ $worker.mcp_server.port }}
      protocol: TCP
    {{- end }}
    {{- if $worker.ai_gateway }}
    - port: {{ $worker.ai_gateway.port }}
      protocol: TCP
    {{- end }}
    {{- if $worker.web }}
    - port: {{ $worker.web.port }}
      protocol: TCP
    {{- end }}
    - port: {{ default 8081 (dig "health" "port" nil $worker) }}
      protocol: TCP
{{- end }}
