# Shared configuration across components.
#
# Any key here can be overridden from the environment: APP_ prefixes the key
# and __ separates each level, so APP_AUTH__CLIENT_SECRET sets
# auth.client_secret.

# Cache service configuration (optional, shared across worker and server).
# The cache is used for:
# - State persistence across workflow executions (e.g., replay identifiers)
# - Distributed coordination and leader election via atomic operations
# Without this section, flowgen keeps the cache in a local redb file at
# .flowgen/state.redb, for a single process. NATS shares it across replicas.
cache:
  # `nats` shares the cache across replicas; `redb` (the default) keeps it in
  # the local file at `path`.
  type: nats
  url: "nats://localhost:4222"
  # path: ".flowgen/state.redb"
  # Optional path to a NATS credentials file.
  # credentials_path: "/etc/nats/credentials.json"
  # Two buckets, split by who can reach them; omit either for the default.
  # runtime:
  #   # Flow state, reachable from scripts through ctx.cache.
  #   db_name: "flowgen_cache"
  # system:
  #   # Out of reach of scripts: leader-election leases, peers, and the
  #   # flows, resources and releases loaded from the cache.
  #   db_name: "flowgen_system"
  # Historical entries kept per key, when NATS creates a bucket (default 64,
  # the NATS cap).
  # history: 64
  # TTL of delete markers, when NATS creates a bucket (default 1h). Per-key
  # TTLs on cache entries need it.
  # tombstone_ttl: "1h"

# Flow discovery configuration (shared across worker and server).
# Path can be either a base directory path (e.g., "flows") - recursively loads all .yaml, .yml, and .json files.
# Filesystem and cache sources are independent: configure either, both, or neither.
# When both are active, the filesystem entry wins on name collisions.
flows:
  path: "path_to_configs_folder"
  # Optional: also load the flows under `flows.` in the system bucket, which
  # the deploy flow writes. A filesystem flow with the same identity wins.
  # cache:
  #   enabled: true
  # Optional: run this version's system flows under `system/` (commit,
  # release, deploy, Flowgen Agent, hubs); a flow at `path` with the same
  # identity takes their place.
  # system: true
  # Optional: system flows left out, such as the release flow when the
  # repository's CI pushes the releases.
  # system_exclude: ["system/release_workspace"]

# Resource loading configuration (optional, shared across worker and server).
# Enables loading external files (SQL queries, templates, etc.) instead of embedding content in YAML.
resources:
  path: "path_to_resources_folder"
  # Optional: fall back to the resources under `resources.` in the system bucket.
  # cache:
  #   enabled: true

# OpenTelemetry configuration for metrics, traces, and logs (optional).
# When enabled without a backend, signals stay in-process (memory backend).
# With the `remote` backend, signals go over OTLP/gRPC to a collector.
telemetry:
  enabled: false
  # Optional: backend selection.
  # backend:
  #   type: remote
  #   endpoint: "http://otel-collector:4317"
  # Or, the default in-memory backend; with `cache`, the web UI shows every pod:
  # backend:
  #   type: memory
  #   logs_per_flow: 1000
  #   metrics_per_flow: 1000
  #   port: 8082
  # Optional: service name (defaults to "flowgen").
  # service_name: "flowgen"
  # Optional: metrics export interval using human-readable format (defaults to "60s").
  # metrics_export_interval: "60s"

# The OpenID Connect provider people sign in with (optional). The web UI logs
# in through it, and the HTTP server, MCP server and AI gateway accept its
# tokens unless they set their own `auth`. Omit to leave them all
# unauthenticated. flowgen keeps no server-side session store: the browser's
# cookie holds the provider's tokens, encrypted with a key the first pod
# generates and keeps in the system bucket.
# auth:
#   issuer_url: "https://auth.example.com"
#   client_id: "my-client-id"
#   # JSON file holding client_secret and cookie_secret, e.g. a mounted
#   # Kubernetes secret — keeps both out of this file. Wins over
#   # client_secret here and over web.cookie_secret.
#   credentials_path: "/etc/flowgen/credentials/web.json"
#   # Inline alternative to the file above.
#   # client_secret: "your-oidc-client-secret"
#   # Must exactly match a redirect URI registered with the provider, and
#   # include the web UI's `path` (here, "/flowgen").
#   redirect_uri: "https://example.com/flowgen/auth/callback"
#   # Requested next to openid, profile and email. Most providers issue a
#   # refresh token only with offline_access.
#   # extra_scopes: ["offline_access", "groups"]
#   # The provider's logout URL, with its own return URL already embedded and
#   # registered with the provider. flowgen appends `id_token_hint`. Unset
#   # signs out of flowgen only, leaving the provider's session intact.
#   # signout_redirect_url: "https://auth.example.com/logout?post_logout_redirect_uri=https%3A%2F%2Fexample.com%2Fflowgen%2F"
#   # The `aud` of the tokens the servers accept, when the provider's access
#   # tokens don't carry client_id (default client_id).
#   # audience: "api://example"

# HTTP server for webhooks, health checks, and metrics (optional, defaults to port 3000).
http_server:
  enabled: true
  port: 3000
  # Optional path prefix for all routes (e.g., "/api/flowgen/workers").
  path: "/api/flowgen/workers"
  # Optional credentials file for webhook authentication.
  # Individual http_endpoint tasks can override this with their own credentials_path.
  # credentials_path: "/etc/http/credentials.json"

  # Optional user authentication provider for JWT, OIDC, or session token validation.
  # Shared across all HTTP-facing tasks (http_endpoint, llm_proxy, mcp_tool).
  # Tasks opt in with auth.required: true in their config. Defaults to the
  # top-level auth.

  # JWT with local HMAC secret:
  # auth:
  #   type: jwt
  #   secret: "your-hmac-secret"
  #   audience: "my-api"             # optional: validate audience claim
  #   issuer: "https://auth.example.com"  # optional: validate issuer claim
  #   user_id_claim: "sub"           # optional: claim to extract as user_id (defaults to "sub")

  # JWT with remote JWKS (RS256/ES256):
  # auth:
  #   type: jwt
  #   jwks_url: "https://auth.example.com/.well-known/jwks.json"
  #   audience: "my-api"

  # OIDC discovery (auto-fetches JWKS from issuer):
  # auth:
  #   type: oidc
  #   issuer_url: "https://auth.example.com/realms/myapp"
  #   audience: "my-api"
  #   # How often a token signed with an unknown key may fetch the keys again
  #   # (default 5m), which picks up the provider's next signing key.
  #   jwks_refresh: 5m

  # Session token validation via external HTTP endpoint:
  # auth:
  #   type: session
  #   validation_url: "https://auth.example.com/validate"
  #   user_id_field: "user_id"       # optional: JSON field in response (defaults to "user_id")

# MCP server configuration for exposing flows as MCP tools (optional).
# Runs on its own port, independent of the HTTP server.
# Must be explicitly enabled for mcp_tool tasks to be registered.
# Global credentials apply to all mcp_tool endpoints unless overridden per tool.
# mcp_server:
#   enabled: true
#   port: 3001
#   path: "/mcp/v1"
#   credentials_path: "/etc/mcp/api-keys.json"
#   # With the top-level auth, or an `oidc` provider here, every request
#   # needs an API key or a token, and clients without one are sent to sign
#   # in. The address they reach this server at through a proxy; without
#   # one, it is the address the client used.
#   public_url: "https://mcp.example.com"

# AI gateway server configuration for OpenAI-compatible chat completion endpoints (optional).
# Runs on its own port, independent of the HTTP and MCP servers.
# Must be explicitly enabled for llm_proxy tasks to be registered.
# ai_gateway:
#   enabled: true
#   port: 3002
#   path: "/v1"
#   credentials_path: "/etc/flowgen/credentials/ai.json"

# Web UI for inspecting loaded flows, reading logs, and the built-in Agents
# chat (optional). Served from the flowgen binary itself.
# Defaults to port 8080 and path "/".
# web:
#   enabled: true
#   port: 8080
#   path: "/flowgen"
#   # Base URL of the AI gateway the Agents tab replies through. Omit to
#   # target the same-process AI gateway on loopback; set when the gateway
#   # runs in a separate process or pod.
#   ai_gateway_url: "http://127.0.0.1:3002/v1"
#   # The Agents tab and /api/agents. Omit to hide the tab.
#   agents:
#     enabled: true
#     # How long an agent session lives in the configured cache before it
#     # expires, refreshed on every write. Defaults to 30 days; set to 0 to
#     # persist indefinitely. Long-term history belongs in a database via a
#     # persistence flow, not this cache.
#     session_history_ttl: 30d
#     # Call the AI gateway as the signed-in user, with their access token as
#     # the bearer (default false). Needs auth, and the gateway's auth
#     # provider must accept the token. Replaces any Authorization header in
#     # web.headers.
#     # on_behalf_of_user: true
#     # Cache key prefix for sessions, read state and folders. A flow
#     # opens a session under `<cache_prefix>.sessions.`.
#     # cache_prefix: agents
#     # How often a reply in progress is saved (default 3s).
#     # reply_save_interval: 3s
#     # How long a reply may go without any output from the AI gateway
#     # before it fails (default 10m).
#     # reply_idle_timeout: 10m
#   # HTTP headers sent with every request the web server makes to the AI
#   # gateway for the Agents tab, such as a key the gateway requires.
#   # headers:
#   #   Authorization: "Bearer <key>"
#   # Optional: your own cookie key instead of the generated one.
#   # cookie_secret: "a long random string, at least 32 bytes"
#   # Login cookies require HTTPS by default. Set to false only for a
#   # plain-HTTP deployment (local testing, or a proxy that already
#   # terminates TLS and is trusted to keep the connection private).
#   # cookie_secure: false
#   # Machine keys accepted as `Authorization: Bearer` next to the login
#   # session: {"api_keys": [{"name": "operator-agent", "key": "..."}]}.
#   # Keys can read and propose changes, never approve them.
#   # api_credentials_path: "/etc/flowgen/credentials/api.json"
#   # Who may show the web UI in a frame (Content-Security-Policy
#   # frame-ancestors). Defaults to the UI's own origin.
#   # frame_ancestors: ["'self'", "https://console.example.com"]
#   # Checking for a newer flowgen release, shown next to the version.
#   # update_check:
#   #   enabled: true
#   #   url: "https://api.github.com/repos/connve/flowgen/releases/latest"
#   #   interval: 1h
#   # Change proposals for flows and resources, approved in the web UI.
#   # authoring:
#   #   enabled: true
#   #   # Where changes can be proposed; a change's files must all fall in one
#   #   # target. Paths outside every target (here flows/system/) are edited
#   #   # in the repository only. Defaults to one target over flows/ and
#   #   # resources/.
#   #   targets:
#   #     - name: platform
#   #       paths: ["flows/platform/", "resources/platform/"]
#   #       # Identity provider groups allowed to approve, matched against the
#   #       # claim named by groups_claim; empty allows everyone signed in.
#   #       approver_groups: ["platform-engineers"]
#   #     - name: user
#   #       paths: ["flows/user/", "resources/user/"]
#   #       approver_groups: ["business-leads"]
#   #       # Flow, starting with an inproc_endpoint, that commits the
#   #       # target's approved changes (default system/commit_workspace).
#   #       commit_flow: system/commit_workspace
#   #       # Report when a committed change runs here (default true); turn
#   #       # off when this target is not deployed to this instance.
#   #       track_deployment: true
#   #   # Claim of the signed-in user that lists their groups (default groups).
#   #   # groups_claim: groups

# Kubernetes liveness/readiness listener. Independent from the API
# listeners so probes keep working regardless of which surfaces are
# enabled. Endpoints: /livez, /readyz, /healthz (alias of /livez).
# Defaults to enabled on port 8081. Set enabled: false to skip.
# health:
#   enabled: true
#   port: 8081

# How long a stopping flow lets its events in flight finish before its
# tasks are aborted (default 20s; a flow can set its own).
# shutdown_timeout: 20s

# The address every server listens on (default 0.0.0.0); 127.0.0.1 keeps
# them to this machine.
# host: 0.0.0.0

# Default retry of every task; a task can set its own.
# retry:
#   max_attempts: 10
#   initial_backoff: 1s

# Credentials added in the web UI, encrypted with SOPS and age (optional).
# credentials:
#   # age public keys each credential is encrypted for.
#   recipients: ["age1..."]
#   # The age key this instance decrypts with; omit where the cluster
#   # decrypts the credentials.
#   identity_path: .flowgen/age.key
#   # The folder flows read credentials from, which FLOWGEN_CREDENTIALS names.
#   path: credentials

# Limits on what every ai_completion uses, across all models (optional).
# ai_budget:
#   limits:
#     - scope: workspace
#       period: month
#       max_tokens: 50000000
#     - scope: user
#       period: day
#       max_amount: 5
#   # Price per million prompt (input) and completion (output) tokens,
#   # which amount limits need.
#   prices:
#     model-name: { input: 0.40, output: 2.00 }

