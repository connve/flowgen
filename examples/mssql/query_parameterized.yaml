# Poll SQL Server every 5 minutes with a parameterised query loaded
# from a resource file. Parameters are positional (@p1, @p2, ...) and
# the driver escapes them safely.
#
# Required:
#   - SQL Server credentials at /etc/mssql/credentials.json
#   - resources/mssql/queries/fetch_orders.sql (referencing @p1, @p2)
flow:
  labels:
    display_name: "MSSQL Parameterized Query"
    description: "Polls SQL Server every 5 minutes with a parameterised query loaded from a resource file, converts the Arrow result to JSON, and logs one event per row."
    tags: ["mssql", "query", "parameterized", "resource-file", "example"]
  require_leader_election: true
  tasks:

    # Tick every 5 minutes.
    - generate:
        name: generate_jobs
        interval: 300s

    # Parameterised query, SQL loaded from a resource file.
    - mssql_query:
        name: fetch_orders
        credentials_path: /etc/mssql/credentials.json
        query:
          resource: "mssql/queries/fetch_orders.sql"
        parameters:
          - "completed"
          - "2024-01-01"

    # Arrow → JSON for downstream JSON-shaped tasks.
    - convert:
        name: arrow_to_json
        target_format: json

    # Split the JSON array into one event per row.
    - iterate:
        name: split_rows

    # Log each row.
    - log:
        name: log
        level: info
