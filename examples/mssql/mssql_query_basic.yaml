# Fetch active customers from SQL Server, convert to JSON, log per row.
# One-shot: the generate task fires once ten seconds after startup.
#
# Required:
#   - SQL Server credentials at /etc/mssql/credentials.json
flow:
  labels:
    display_name: "MSSQL Basic Query"
    description: "Runs a one-shot inline SQL Server query for active customers, converts the Arrow result to JSON, and logs one event per row."
    tags: ["mssql", "query", "sql-server", "example"]
  require_leader_election: true
  tasks:

    # One-shot trigger, ten seconds after startup.
    - generate:
        name: trigger
        interval: 10s
        count: 1

    # Query customers as Arrow RecordBatch.
    - mssql_query:
        name: fetch_customers
        credentials_path: /etc/mssql/credentials.json
        query: "SELECT customer_id, customer_name, email, created_at FROM customers WHERE active = 1 ORDER BY created_at DESC"

    # Arrow → JSON for downstream JSON-shaped tasks.
    - convert:
        name: arrow_to_json
        target_format: json

    # Split the JSON array into one event per row.
    - iterate:
        name: split_rows

    # Log each row.
    - log:
        name: log
        level: info
