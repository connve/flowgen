# Bootstrap flow: keeps the system NATS KV cache equal to the flows and
# resources of a Git repository. When the branch has a new commit, mirrors
# `flows/` into `flows.` keys (`flows/demo/foo.yaml` becomes `flows.demo/foo`,
# so the folder is the flow's identity) and `resources/` into `resources.`
# keys. Unchanged keys are not rewritten, keys no longer in the repository
# are deleted, and other files are ignored.
#
# Repo layout expected under the configured `path:`
#
#   workspace/
#   ├── flows/
#   │   └── ...*.yaml
#   └── resources/
#       └── ...
#
# Required:
#   - GIT_WORKSPACE_URL env var, e.g.
#       https://github.com/org/flowgen-workspace.git
#   - /etc/flowgen/credentials/git.json with
#       { "token": "..." }
#   - /etc/nats/credentials.json for NATS KV writes.
#   - NATS_URL env var (e.g. nats://localhost:4222)
flow:
  labels:
    display_name: "Sync Workspace From Git"
    description: "Mirrors the flows and resources of a Git repository into the system NATS KV cache at each new commit, deleting what the repository no longer holds."
    tags: ["system", "git-sync", "nats-kv", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: tick
        interval: "30s"

    # Emits every file under workspace/ when the branch has a new commit.
    - git_sync:
        name: pull_repo
        repository_url: "{{env.GIT_WORKSPACE_URL}}"
        branch: main
        path: "workspace/"
        credentials_path: /etc/flowgen/credentials/git.json

    # One batch per pull, flushed on the pull's last file.
    - buffer:
        name: collect_files
        size: 10000
        timeout: "5m"
        flush_on_completion: true

    # Splits a complete pull into cache entries; a pull cut short by the
    # timeout is skipped, so prune never runs on a partial list.
    - script:
        name: to_entries
        code: |
          if event.data.flush_reason != "completion" { return (); }
          let flows = [];
          let resources = [];
          for file in event.data.batch {
              if file.path.starts_with("flows/") {
                  let key = regex_replace(file.path.sub_string(6), "\\.(yaml|yml|json)$", "");
                  flows.push(#{ key: key, value: file.content });
              } else if file.path.starts_with("resources/") {
                  resources.push(#{ key: file.path.sub_string(10), value: file.content });
              }
          }
          #{ flows: flows, resources: resources }

    - script:
        name: flow_entries
        code: |
          #{ entries: event.data.flows }

    - nats_kv_store:
        name: apply_flows
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        bucket: flowgen_system
        operation: put
        key_prefix: "flows."
        prune: true
        allow_empty: true

    - script:
        name: resource_entries
        code: |
          #{ entries: event.data.resources }
        depends_on: [to_entries]

    - nats_kv_store:
        name: apply_resources
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        bucket: flowgen_system
        operation: put
        key_prefix: "resources."
        prune: true
        allow_empty: true
        depends_on: [resource_entries]
