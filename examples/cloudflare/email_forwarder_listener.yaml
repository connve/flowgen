# Receive forwarded emails from a Cloudflare Email Worker and republish
# each payload to NATS. Pair with the writer flow to persist them.
#
# Required:
#   - Webhook credentials at /etc/cloudflare-emails/credentials.json
#   - NATS credentials at /etc/nats/credentials.json
flow:
  labels:
    display_name: "Cloudflare Email Webhook Listener"
    description: "Receives forwarded emails from a Cloudflare Email Worker over an HTTP webhook, unwraps the payload, and publishes each message to a NATS JetStream stream."
    tags: ["cloudflare", "email", "webhook", "nats", "example"]
  tasks:

    # POST /api/flowgen/workers/webhook/cloudflare/emails
    - http_endpoint:
        name: receive_requests
        credentials_path: /etc/cloudflare-emails/credentials.json
        method: POST
        endpoint: /cloudflare/emails

    # Cloudflare wraps the message in `payload`; unwrap before publishing.
    - script:
        name: return_payload
        code: |
          event.data.payload

    - nats_jetstream_publisher:
        name: publish_events
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        subject: email.received
        stream:
          create_or_update: true
          name: cloudflare
          description: "Cloudflare events stream"
          subjects: ["email.>"]
          max_age: "24h"
          retention: limits
          discard_policy: old
