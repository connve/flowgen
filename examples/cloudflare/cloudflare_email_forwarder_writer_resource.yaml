# Same as cloudflare_email_forwarder_writer.yaml but the Avro schema
# is loaded from a resource file instead of inlined.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - resources/schemas/email_message.avsc
flow:
  labels:
    display_name: "Cloudflare Email Writer (Schema File)"
    description: "Consumes forwarded emails from NATS, converts JSON to Avro using a schema loaded from a resource file, and archives them to the object store partitioned by EventDate."
    tags: ["cloudflare", "email", "nats", "object-store", "example"]
  tasks:

    - nats_jetstream_subscriber:
        name: start_subscription
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        subject: email.received
        stream:
          create_or_update: true
          name: cloudflare
          description: "Cloudflare events stream"
          subjects: ["email.>"]
          max_age: "24h"
          retention: limits
          discard_policy: old
        durable_name: cloudflare_email_forwarder_writer
        max_messages: 100
        delay: 1s

    - convert:
        name: json_avro_converter
        target_format: avro
        schema:
          resource: "schemas/email_message.avsc"

    - object_store_write:
        name: write_events
        path: file:///cloudflare/email
        hive_partition_options:
          enabled: true
          partition_keys:
            - EventDate
