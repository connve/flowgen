# Publishes an approved workspace change by committing its files to the
# workspace repository. Releasing the commit is up to the deployment: its CI,
# or examples/authoring/release_workspace.yaml where there is none.
#
# Deploy it as `system/publish_workspace.yaml`, the default
# `web.authoring.publish_flow`. Approvals call it in-process; it has no HTTP route.
#
# Required:
#   - GIT_WORKSPACE_URL env var
#   - /etc/flowgen/credentials/git.json ({token, username?})
flow:
  labels:
    display_name: "Publish Workspace"
    description: "Commits an approved change to the workspace repository."
    tags: ["system", "git-push", "authoring", "example"]
  tasks:

    # Receives {id, title, author, files} from an approved change.
    - inproc_endpoint:
        name: on_approve
        ack_timeout: 120s

    # Commits the files under workspace/; fails on a conflict with `previous`.
    - git_push:
        name: commit
        repository_url: "{{env.GIT_WORKSPACE_URL}}"
        path: "workspace/"
        credentials_path: /etc/flowgen/credentials/git.json
        author:
          name: "{{event.data.author.name}}"
          email: "{{event.data.author.email}}"
        message: "{{event.data.title}}"

    # Recorded on the change as its result.
    - script:
        name: result
        code: |
          #{ commit: event.data.commit, changed: event.data.changed }
