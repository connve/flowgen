# Webhook → LLM completion, with system and user prompts loaded from
# resource files. Sandbox limits are the defaults; override under
# `sandbox:` to tune.
#
# Required:
#   - Anthropic API key at /etc/anthropic/credentials.json
#   - resources/ai-completion/prompts/analyst_system.md
#   - resources/ai-completion/prompts/analyze_data.md
flow:
  name: resource_prompt_completion
  labels:
    description: "Webhook → LLM completion with system and user prompts loaded from resource files."
    tags: ["ai", "webhook", "example"]
  tasks:

    # POST /api/flowgen/workers/webhook/analyze with the payload to analyse.
    - http_endpoint:
        name: receive_data
        path: /analyze

    - ai_completion:
        name: analyze_data
        provider: anthropic
        model: claude-3-5-sonnet-20241022
        credentials_path: /etc/anthropic/credentials.json
        system_prompt:
          resource: "ai-completion/prompts/analyst_system.md"
        prompt:
          resource: "ai-completion/prompts/analyze_data.md"
        temperature: 0.5
        max_tokens: 2000
