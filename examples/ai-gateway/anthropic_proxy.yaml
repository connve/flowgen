# Anthropic Messages API gateway. Same script-driven fanout as
# openai_proxy.yaml but speaks the Anthropic wire so clients that
# honour `ANTHROPIC_BASE_URL` (Claude Code, the official Anthropic
# SDKs) reach downstream OpenAI-compatible providers through this
# flow. The gateway translates Anthropic messages/tool schemas into
# the shared internal payload, and translates the leaf response back
# on the way out.
#
# Client env:
#   ANTHROPIC_BASE_URL=http://<host>:3002
#   ANTHROPIC_AUTH_TOKEN=<any non-empty value; matches worker credentials when configured>
#   ANTHROPIC_MODEL=flowgen_anthropic/<alias>          # e.g. flowgen_anthropic/kimi
#
# The `flowgen_anthropic/` prefix picks this flow; `<alias>` selects
# the downstream provider. Aliases are defined in the shared
# `route_provider.rhai` script.
#
# Required:
#   - AI gateway enabled in worker config
#   - Downstream provider credentials under /etc/<alias>/credentials.json
flow:
  labels:
    display_name: "Anthropic API Gateway"
    description: "Exposes an Anthropic Messages-compatible endpoint that routes a client model alias to a downstream provider and streams the completion back in Anthropic wire format."
    tags: ["ai-gateway", "anthropic", "llm-proxy", "streaming", "example"]
  tasks:

    - llm_proxy:
        name: flowgen_anthropic
        protocol: anthropic

    # Route the client alias to a concrete provider. Shared with
    # openai_proxy.yaml so both endpoints stay in sync.
    - script:
        name: route_provider
        code:
          resource: "scripts/ai-gateway/route_provider.rhai"

    # Tool schemas are already translated to the OpenAI shape by the
    # /messages handler; `tool_passthrough: true` forwards them verbatim
    # so tool-use round-trips end-to-end back into an Anthropic-shaped
    # response.
    - ai_completion:
        name: forward
        provider: custom
        endpoint: "{{event.data.endpoint}}"
        model: "{{event.data.routed_model}}"
        credentials_path: "{{event.data.credentials_path}}"
        prompt: "{{event.data.prompt}}"
        system_prompt: "{{event.data.system_prompt}}"
        tool_passthrough: true
        stream: true
