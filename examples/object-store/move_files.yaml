# Load Parquet files from GCS into BigQuery staging, then archive the
# exact same files. Building an explicit URI list from `list` output
# guarantees the same set is loaded and archived — GCS eventual
# consistency would otherwise let a naive wildcard drop files.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  require_leader_election: true
  name: move_files_after_processing
  tasks:

    - generate:
        name: trigger
        interval: 5m

    - object_store_list:
        name: list_unprocessed_files
        path: gs://my-bucket/incoming/*.parquet
        credentials_path: /etc/gcp/credentials.json

    # Reconstruct absolute GCS URIs from the list results and stash them
    # so both BigQuery and the archive step act on the identical set.
    - script:
        name: build_file_list
        code: |
          if event.data.files.len() == 0 {
            return ();
          }

          let path_parts = event.data.path.split("/");
          let bucket = path_parts[0] + "//" + path_parts[2];

          let source_uris = [];
          for file in event.data.files {
            source_uris.push(bucket + "/" + file.location);
          }

          ctx.meta.file_count = source_uris.len();
          ctx.meta.source_uris = source_uris;

          event

    - gcp_bigquery_job:
        name: load_to_bigquery
        operation: create
        project_id: my-project
        credentials_path: /etc/gcp/credentials.json
        job_type: load
        source_uris: "{{event.meta.source_uris}}"
        destination_table:
          project_id: my-project
          dataset_id: staging
          table_id: data
        source_format: parquet
        write_disposition: write_append
        create_disposition: create_if_needed
        autodetect: true

    # Archive exactly the URIs that BigQuery loaded, atomic w.r.t. the load.
    - object_store_move:
        name: archive_processed_files
        source_files: "{{event.meta.source_uris}}"
        destination: gs://my-bucket/processed/
        credentials_path: /etc/gcp/credentials.json

    - log:
        name: print_move_result
