# Read a CSV file, split rows, then re-batch them into partitioned
# groups of 75 before publishing. `partition_key` gives each key its
# own buffer that flushes on size or timeout independently.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - examples/data/orders.csv
flow:
  require_leader_election: true
  name: read_file_with_buffer
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    - object_store_read:
        name: read_file
        path: file:///flowgen/examples/data/orders.csv
        batch_size: 1000
        has_header: true

    - convert:
        name: to_json
        target_format: json

    - iterate:
        name: split_rows

    # One buffer per payment_type; flushes at 75 events or 30s.
    - buffer:
        name: group_into_batches
        size: 75
        partition_key: "{{event.data.payment_type}}"
        timeout: "30s"

    # Unwrap the buffer and expose partition_key via event.meta.
    - script:
        name: unwrap_batch
        code: |
          #{
            "data": event.data.batch,
            "_meta": #{
              "partition_key": event.data.partition_key
            }
          }

    - nats_jetstream_publisher:
        name: publish_batches
        credentials_path: /etc/nats/credentials.json
        url: "localhost:4222"
        subject: rows.received_batched
        stream:
          create_or_update: true
          name: file
          description: "All general file drops"
          subjects: ["rows.>"]
          max_age: "24h"
          retention: limits
          discard: old
