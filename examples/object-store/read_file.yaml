# Read a CSV file, split rows, publish each as a NATS message.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - examples/data/orders.csv
flow:
  require_leader_election: true
  name: read_file
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    - object_store_read:
        name: read_file
        path: file:///flowgen/examples/data/orders.csv
        batch_size: 1000
        has_header: true

    - convert:
        name: to_json
        target_format: json

    # Fan-out: one downstream event per row.
    - iterate:
        name: split_rows

    - nats_jetstream_publisher:
        name: publish_to_queue
        credentials_path: /etc/nats/credentials.json
        url: "localhost:4222"
        subject: rows.received
        stream:
          create_or_update: true
          name: file
          description: "All general file drops"
          subjects: ["rows.>"]
          max_age: "24h"
          retention: limits
          discard: old
