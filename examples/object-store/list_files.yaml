# List Parquet files in a GCS bucket once at startup. Useful as a
# discovery step before downstream tasks read or move them.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  require_leader_election: true
  name: list_files
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    # Returns metadata (path, size, mtime) for each match.
    - object_store_list:
        name: list_gcs_files
        path: gs://my-bucket/data/*.parquet
        credentials_path: /etc/gcp/credentials.json

    - log:
        name: print_files
