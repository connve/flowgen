# Run N independent flow pipelines inside the same process.
# `parallel_instances: 5` spawns 5 pipelines; combined with leader
# election, exactly one pod runs all 5. Look for the `flow_instance`
# span (instance=1..5) in logs to see which pipeline handled an event.
flow:
  labels:
    display_name: "Parallel Instances"
    description: "Runs 5 independent flow pipelines inside the same process for horizontal throughput within a single pod."
    tags: ["parallel", "example"]
  require_leader_election: true
  parallel_instances: 5
  tasks:

    # Each instance ticks independently every 5 seconds.
    - generate:
        name: trigger
        interval: 5s
        count: 1

    # Log the event; span carries the instance identifier.
    - log:
        name: log_message
        level: info
