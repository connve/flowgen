# Bootstrap flow: keeps the system NATS KV cache equal to the flows and
# resources of an OCI artifact. When the artifact's digest changes, pulls it
# and mirrors `flows/` into `flows.` keys (`flows/demo/foo.yaml` becomes
# `flows.demo/foo`, so the folder is the flow's identity) and `resources/`
# into `resources.` keys. Unchanged keys are not rewritten, keys no longer in
# the artifact are deleted, and other files in the artifact are ignored.
#
# The artifact must be built with `FROM scratch` so its final layer contains
# only `flows/` and `resources/` — a base image (busybox, alpine) drops
# binaries into the layer. See docs/flowgen/oci/sync for the Dockerfile pattern.
#
# Required:
#   - OCI_WORKSPACE_ARTIFACT env var, e.g.
#       registry.example.com/org/flowgen-workspace:prod
#   - /etc/flowgen/credentials/registry.json with either
#       { "username": "...", "password": "..." }
#     or a Docker config.json payload (kubernetes.io/dockerconfigjson).
#   - /etc/nats/credentials.json for NATS KV writes.
#   - NATS_URL env var (e.g. nats://localhost:4222)
flow:
  labels:
    display_name: "Sync Workspace From OCI"
    description: "Mirrors the flows and resources of an OCI artifact into the system NATS KV cache when its digest changes, deleting what the artifact no longer holds."
    tags: ["system", "oci-sync", "nats-kv", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: tick
        interval: "30s"

    - oci_sync:
        name: pull_repo
        artifact: "{{env.OCI_WORKSPACE_ARTIFACT}}"
        credentials_path: /etc/flowgen/credentials/registry.json

    # One batch per pull, flushed on the pull's last layer.
    - buffer:
        name: collect_layers
        size: 10000
        timeout: "5m"
        flush_on_completion: true

    # Splits a complete pull into cache entries; a pull cut short by the
    # timeout is skipped, so prune never runs on a partial list.
    - script:
        name: to_entries
        code: |
          if event.data.flush_reason != "completion" { return (); }
          let flows = [];
          let resources = [];
          for layer in event.data.batch {
              if layer.path.starts_with("flows/") {
                  let key = regex_replace(layer.path.sub_string(6), "\\.(yaml|yml|json)$", "");
                  flows.push(#{ key: key, value: layer.content });
              } else if layer.path.starts_with("resources/") {
                  resources.push(#{ key: layer.path.sub_string(10), value: layer.content });
              }
          }
          #{ flows: flows, resources: resources }

    - script:
        name: flow_entries
        code: |
          #{ entries: event.data.flows }

    # An empty flow list fails and deletes nothing.
    - nats_kv_store:
        name: apply_flows
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        bucket: flowgen_system
        operation: put
        key_prefix: "flows."
        prune: true

    - script:
        name: resource_entries
        code: |
          #{ entries: event.data.resources }
        depends_on: [to_entries]

    # A workspace may hold no resources, so an empty list prunes them all.
    - nats_kv_store:
        name: apply_resources
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        bucket: flowgen_system
        operation: put
        key_prefix: "resources."
        prune: true
        allow_empty: true
        depends_on: [resource_entries]
