# Deduplicate events by ID using `ctx.cache`. Duplicate events return
# null and are dropped; unseen ones are stamped with a 24 h TTL.
flow:
  labels:
    display_name: "Cache Deduplication"
    description: "Deduplicates events by ID using ctx.cache, dropping duplicates and stamping unseen events with a 24-hour TTL."
    tags: ["script", "cache", "deduplication", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s

    - script:
        name: deduplicate_with_cache
        code: |
          let event_id = event.data.id;
          let cache_key = "processed:" + event_id;

          let already_processed = ctx.cache.get(cache_key);

          if already_processed != () {
            print("Event " + event_id + " already processed, skipping");
            return null;
          }

          ctx.cache.put(cache_key, "true", 86400);

          ctx.meta.processed_at = timestamp_now();
          ctx.meta.cache_key = cache_key;

          event

    - log:
        name: log_new_events
        level: info
