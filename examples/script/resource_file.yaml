# Load Rhai from a resource file. Prefer this over inline `code:` for
# anything beyond a few lines — version control, IDE support, and reuse.
#
# Required:
#   - resources/scripts/transform_data.rhai
flow:
  labels:
    display_name: "External Resource Script"
    description: "Runs a scheduled trigger through a Rhai transform script loaded from an external resource file, then logs the result."
    tags: ["script", "rhai", "resource-file", "transform", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 5s
        count: 1

    - script:
        name: transform_with_external_script
        code:
          resource: "scripts/transform_data.rhai"

    - log:
        name: log_result
        level: info
