# Fan-in join: two independent object_store_read sources feed a buffer
# of size 2, then an external Rhai script joins their payloads. The
# same shape works for any two-source enrichment (e.g. large table +
# small lookup from a warehouse).
#
# Required:
#   - examples/data/orders.csv
#   - examples/data/payment_types.csv
#   - resources/scripts/orders_payment_label_join.rhai
flow:
  name: script_fan_in_join
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    # Source 1: canonical orders dataset.
    - object_store_read:
        name: read_orders
        path: file:///flowgen/examples/data/orders.csv
        batch_size: 10000
        has_header: true
        depends_on: [trigger]

    - convert:
        name: convert_orders
        target_format: json
        depends_on: [read_orders]

    # Source 2: small payment-type lookup table.
    - object_store_read:
        name: read_payment_types
        path: file:///flowgen/examples/data/payment_types.csv
        batch_size: 1000
        has_header: true
        depends_on: [trigger]

    - convert:
        name: convert_payment_types
        target_format: json
        depends_on: [read_payment_types]

    # Buffer flushes once both upstream batches have arrived.
    - buffer:
        name: buffer_both_sources
        size: 2
        timeout: "1m"
        depends_on: [convert_orders, convert_payment_types]

    - script:
        name: join_orders_with_payment_labels
        code:
          resource: "scripts/orders_payment_label_join.rhai"
        depends_on: [buffer_both_sources]

    - log:
        name: log_enriched_orders
        level: info
        structured: true
        depends_on: [join_orders_with_payment_labels]
