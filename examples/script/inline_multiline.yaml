# Inline multi-line Rhai script: adds derived fields and a timestamp.
flow:
  labels:
    display_name: "Inline Multiline Script"
    description: "Runs a multi-line inline Rhai script that adds derived fields (doubled, squared, uppercased category) and a processing timestamp to each event."
    tags: ["script", "rhai", "inline", "enrichment", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 5s
        count: 1

    - script:
        name: enrich_data
        code: |
          let value = event.data.value;
          let category = event.data.category;

          event.data.doubled = value * 2;
          event.data.squared = value * value;
          event.data.category_upper = category.to_upper();

          event.data.processed_at = timestamp_now();
          event

    - log:
        name: log_result
        level: info
