# Minimal inline Rhai script: doubles a numeric field on each event.
flow:
  labels:
    display_name: "Inline Basic Script"
    description: "Runs a minimal single-line inline Rhai script that doubles a numeric field on each event."
    tags: ["script", "rhai", "inline", "transform", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 5s
        count: 1

    # Return the mutated event so it flows on.
    - script:
        name: transform_value
        code: "event.data.value = event.data.value * 2; event"

    - log:
        name: log_result
        level: info
