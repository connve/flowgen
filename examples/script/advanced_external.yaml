# Load a complex Rhai script from a resource file. Prefer this over
# inline `code:` for production logic: version control, editor tooling,
# and shared scripts across flows.
#
# Required:
#   - resources/scripts/cache_and_metadata_advanced.rhai
flow:
  labels:
    display_name: "Advanced External Rhai Script"
    description: "Runs a scheduled trigger through a complex Rhai script loaded from an external resource file for idempotent, stateful processing, then logs the result."
    tags: ["script", "rhai", "resource-file", "stateful", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s

    # Idempotent + stateful processing lives in the loaded script.
    - script:
        name: process_with_advanced_script
        code:
          resource: "scripts/cache_and_metadata_advanced.rhai"

    - log:
        name: log_result
        level: info
