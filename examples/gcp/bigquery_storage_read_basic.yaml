# Read a BigQuery table via the Storage Read API for high-throughput
# parallel reads. Faster than the Query API for large tables. Results
# arrive as Arrow RecordBatch.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  name: bigquery_storage_read_basic
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    # `selected_fields` prunes columns server-side; `row_restriction`
    # filters server-side; `max_stream_count` upper-bounds parallelism.
    - gcp_bigquery_storage_read:
        name: read_orders_table
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        dataset_id: analytics
        table_id: orders
        selected_fields:
          - id
          - customer_id
          - amount
          - order_date
        row_restriction: "order_date >= '2024-01-01'"
        max_stream_count: 4

    - convert:
        name: arrow_to_json
        target_format: json

    - iterate:
        name: split_rows

    - log:
        name: log
        level: info
        structured: false
