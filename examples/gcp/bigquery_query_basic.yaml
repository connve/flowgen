# One-shot BigQuery SELECT ten seconds after startup, then Arrow → JSON,
# split rows, log each. See bigquery_query_parameterized for parameter
# binding.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  name: bigquery_query_basic
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    # Results arrive as Arrow RecordBatch.
    - gcp_bigquery_query:
        name: fetch_orders
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        query: "SELECT id, customer_id, amount, order_date FROM `my-project-id.analytics.orders` WHERE order_date >= '2024-01-01' ORDER BY order_date DESC"
        max_results: 10000
        timeout: "1m"

    - convert:
        name: arrow_to_json
        target_format: json

    - iterate:
        name: split_rows

    - log:
        name: log
        level: info
        structured: false
