# Stream webhook payloads directly into BigQuery via the Storage Write
# API — faster and cheaper than INSERT/MERGE for real-time ingest.
# Default streams give sub-second data availability.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  labels:
    display_name: "BigQuery Storage Write (Basic)"
    description: "Receives webhook POST payloads over an HTTP endpoint and streams each one into a BigQuery table via the Storage Write API."
    tags: ["bigquery", "gcp", "storage-write", "webhook", "example"]
  require_leader_election: true
  tasks:

    # POST /api/flowgen/workers/webhook/events; each POST becomes one event.
    - http_endpoint:
        name: receive_webhook
        path: /webhooks/events
        max_concurrent_requests: 100

    # Task-level retry covers transient BigQuery API failures.
    - gcp_bigquery_storage_write:
        name: stream_to_bigquery
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        dataset_id: analytics
        table_id: events
        retry:
          max_attempts: 3
          max_delay: "10s"

    - log:
        name: log_result
        level: info
