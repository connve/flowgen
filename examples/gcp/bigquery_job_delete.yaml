# Delete BigQuery job metadata. Removes only the job record — the
# tables/rows loaded by the job stay in place. Deleted jobs cannot be
# recovered or monitored afterwards.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  labels:
    display_name: "BigQuery Job Delete"
    description: "Deletes a BigQuery job's metadata record on a daily schedule, leaving the loaded tables and rows in place."
    tags: ["bigquery", "gcp", "job", "cleanup", "example"]
  require_leader_election: true
  tasks:

    # Daily cleanup tick.
    - generate:
        name: trigger
        interval: 86400s

    # `delete` removes the job metadata. Polling fields carry defaults
    # because the operation is instant.
    - gcp_bigquery_job:
        name: delete_old_job
        operation: delete
        project_id: my-gcp-project
        credentials_path: /etc/gcp/credentials.json
        job_type: query
        job_id: "job_abc123xyz"
        poll_interval: 1s
        max_poll_duration: 60s

    # Confirm removal.
    - log:
        name: log_deletion
        level: info
