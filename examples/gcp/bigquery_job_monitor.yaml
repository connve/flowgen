# Poll a BigQuery job until it reaches a terminal state, then log
# the final status. In production this flow is triggered by an
# upstream flow that created the job and passed the id via event data;
# the hardcoded `job_id` here is a placeholder.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  labels:
    display_name: "BigQuery Job Monitor"
    description: "Polls a BigQuery job by ID until it reaches a terminal state, then logs its final status."
    tags: ["bigquery", "gcp", "job", "monitor", "example"]
  require_leader_election: true
  tasks:

    # Placeholder trigger; real deployments emit from upstream job-create flows.
    - generate:
        name: trigger
        interval: 3600s

    # `get` polls until the job is DONE or `max_poll_duration` elapses.
    - gcp_bigquery_job:
        name: poll_job_status
        operation: get
        project_id: my-gcp-project
        credentials_path: /etc/gcp/credentials.json
        job_type: load
        job_id: "job_abc123xyz"
        poll_interval: 5s
        max_poll_duration: 600s

    # Terminal status lives at event.data.status.state; errors at status.error_result.
    - log:
        name: log_job_status
        level: info
