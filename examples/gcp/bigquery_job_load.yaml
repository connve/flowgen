# Create a BigQuery load job that imports Parquet files from GCS into
# a table. `create` returns immediately with job metadata; pair with
# examples/gcp/bigquery_job_monitor.yaml to poll status until DONE.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  name: bigquery_job_load
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 1800s

    # `create_never` fails if the destination table is missing; flip to
    # `create_if_needed` to auto-create from the Parquet schema.
    - gcp_bigquery_job:
        name: load_parquet_data
        operation: create
        project_id: my-gcp-project
        credentials_path: /etc/gcp/credentials.json
        job_type: load
        source_uris:
          - "gs://my-bucket/data/sales/*.parquet"
        destination_table:
          project_id: my-gcp-project
          dataset_id: analytics
          table_id: sales_data
        source_format: parquet
        write_disposition: write_append
        create_disposition: create_never
        autodetect: true

    # Emits job_id; feed downstream to bigquery_job_monitor.
    - log:
        name: log_job_info
        level: info
        structured: true
