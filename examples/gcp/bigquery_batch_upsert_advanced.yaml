# Upsert a batch of orders into BigQuery via MERGE + UNNEST — one query
# per batch instead of per-row DML so we stay under BigQuery's DML rate
# limits. Rate-limited to one batch at a time to prevent concurrent
# MERGE on the same table.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - GCP service account at /etc/gcp/credentials.json
#   - resources/gcp/queries/upsert_orders_batch.sql
flow:
  labels:
    display_name: "BigQuery Batch Upsert (Advanced)"
    description: "Consumes batches from NATS one at a time and upserts them into BigQuery with a single MERGE + UNNEST query per batch, splitting the data and billing projects for cross-project billing."
    tags: ["bigquery", "gcp", "example", "upsert"]
  require_leader_election: true
  tasks:

    # Consume one batch at a time from NATS; `delay` throttles between batches.
    - nats_jetstream_subscriber:
        name: consume_batch
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        subject: bigquery.upsert.orders
        stream:
          create_or_update: true
          name: bigquery_upsert
          description: "BigQuery upsert batches with rate limiting"
          subjects: ["bigquery.upsert.>"]
          max_age: "24h"
          retention: limits
          discard: old
        durable_name: bigquery_upsert_consumer
        max_messages: 1
        delay: "1s"

    # Arrow → JSON so the batch can travel as a query parameter.
    - convert:
        name: arrow_to_json
        target_format: json

    # Wrap the batch with metadata used by the MERGE template.
    - script:
        name: prepare_batch_param
        code: |
          #{
            batch: event.data,
            timestamp: timestamp_now()
          }

    # MERGE + UNNEST upsert. `project_id` locates the table (data project);
    # `job_project_id` runs and bills the job (billing project) — split them
    # to centralise billing across data projects. `use_query_cache: false`
    # because DML must always execute.
    - gcp_bigquery_query:
        name: upsert_batch
        credentials_path: /etc/gcp/credentials.json
        project_id: my-data-project-id
        job_project_id: my-billing-project-id
        query:
          resource: "gcp/queries/upsert_orders_batch.sql"
        parameters:
          batch: "{{event.data.batch}}"
        max_results: 0
        timeout: "30s"
        use_query_cache: false
        location: "US"

    # Emit MERGE row-count for monitoring.
    - log:
        name: log_result
        level: info
