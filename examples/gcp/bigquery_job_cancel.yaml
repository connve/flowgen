# Cancel a running BigQuery job. In production this flow is triggered
# by an upstream event (user action, timeout) that supplies the job_id;
# the hardcoded id here is a placeholder.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  name: bigquery_job_cancel
  require_leader_election: true
  tasks:

    # Placeholder trigger; real deployments emit from upstream flows.
    - generate:
        name: trigger
        interval: 3600s

    # Polling fields carry defaults because cancel is instant.
    - gcp_bigquery_job:
        name: cancel_long_running_job
        operation: cancel
        project_id: my-gcp-project
        credentials_path: /etc/gcp/credentials.json
        job_type: query
        job_id: "job_abc123xyz"
        poll_interval: 1s
        max_poll_duration: 60s

    # Response carries the updated job state.
    - log:
        name: log_cancellation
        level: info
        structured: true
