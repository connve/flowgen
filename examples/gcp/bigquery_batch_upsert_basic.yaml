# Basic batch upsert: consume from NATS, convert to JSON, MERGE + UNNEST
# into BigQuery in one query per batch. See bigquery_batch_upsert_advanced
# for the cross-project-billing variant.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - GCP service account at /etc/gcp/credentials.json
#   - resources/gcp/queries/upsert_orders_batch.sql
flow:
  name: bigquery_batch_upsert_basic
  require_leader_election: true
  tasks:

    # One batch at a time; `delay` throttles between batches.
    - nats_jetstream_subscriber:
        name: consume_batch
        credentials_path: /etc/nats/credentials.json
        url: "localhost:4222"
        subject: bigquery.upsert.orders
        stream:
          create_or_update: true
          name: bigquery_upsert
          description: "BigQuery upsert batches with rate limiting"
          subjects: ["bigquery.upsert.>"]
          max_age: "24h"
          retention: limits
          discard: old
        durable_name: bigquery_upsert_consumer
        max_messages: 1
        delay: "1s"

    # Arrow → JSON so the batch travels as a query parameter.
    - convert:
        name: arrow_to_json
        target_format: json

    # MERGE + UNNEST upsert. Whole JSON array passed as one param.
    - gcp_bigquery_query:
        name: upsert_batch
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        query:
          resource: "gcp/queries/upsert_orders_batch.sql"
        parameters:
          batch: "{{event.data}}"
        timeout: "30s"
        use_query_cache: true
