# Stream enriched events from NATS into BigQuery via the Storage
# Write API, then publish a per-event confirmation back to NATS.
# `trace_id` uses templating so each row is traceable in GCP logs.
#
# Required:
#   - NATS credentials at /etc/nats/credentials.json
#   - GCP service account at /etc/gcp/credentials.json
flow:
  labels:
    display_name: "BigQuery Storage Write (Advanced)"
    description: "Consumes events from NATS, enriches them with ingestion metadata, streams them into BigQuery via the Storage Write API with per-row trace IDs, and publishes a confirmation back to NATS."
    tags: ["bigquery", "gcp", "storage-write", "nats", "example"]
  require_leader_election: true
  tasks:

    # Concurrent NATS consumer with durable state.
    - nats_jetstream_subscriber:
        name: consume_events
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        subject: bigquery.events.>
        stream:
          create_or_update: true
          name: bigquery_events
          description: "Real-time events for BigQuery streaming"
          subjects: ["bigquery.events.>"]
          max_age: "24h"
          retention: limits
          discard: old
        durable_name: bigquery_writer
        max_messages: 10
        max_ack_pending: 100
        max_ack_wait: "30s"

    # Add ingestion metadata and provide defaults for optional fields.
    - script:
        name: enrich_event
        runtime: javascript
        script: |
          event.data.ingested_at = new Date().toISOString();
          event.data.source = event.subject;
          event.data.event_id = event.id;

          event.data.user_id = event.data.user_id || "unknown";
          event.data.event_type = event.data.event_type || "unspecified";

    # Templated `trace_id` gives per-row observability; task-level retry
    # covers transient BigQuery API failures.
    - gcp_bigquery_storage_write:
        name: stream_enriched_events
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        dataset_id: analytics
        table_id: enriched_events
        trace_id: "event-{{event.id}}-{{event.data.user_id}}"
        retry:
          max_attempts: 5
          max_delay: "30s"

    # Confirmation subject routes by event type.
    - nats_jetstream_publisher:
        name: publish_confirmation
        credentials_path: /etc/nats/credentials.json
        url: "{{env.NATS_URL}}"
        subject: "bigquery.confirmations.{{event.data.event_type}}"
        stream:
          create_or_update: true
          name: bigquery_confirmations
          description: "BigQuery write confirmations"
          subjects: ["bigquery.confirmations.>"]
          max_age: "7d"
          retention: limits
          discard: old

    - log:
        name: log_final
        level: info
