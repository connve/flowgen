# Run an EU analytics query every 5 minutes with cross-project
# billing, query labels for cost tracking, and a default dataset for
# unqualified table references.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  labels:
    display_name: "BigQuery Query (Advanced)"
    description: "Runs a parameterized EU analytics query every 5 minutes with cross-project billing, cost-tracking labels, a default dataset, and the Storage Read backend, then splits and logs each row."
    tags: ["bigquery", "gcp", "query", "analytics", "example"]
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 300s

    # Data lives in `data-warehouse-project`, job bills to `billing-project`.
    - gcp_bigquery_query:
        name: cross_project_analytics
        credentials_path: /etc/gcp/credentials.json
        project_id: data-warehouse-project
        job_project_id: billing-project
        query: "SELECT customer_id, SUM(amount) as total FROM `data-warehouse-project.analytics.orders` WHERE region = @region AND order_date >= @start_date GROUP BY customer_id"
        parameters:
          region: "EU"
          start_date: "2024-01-01"
        location: "EU"
        max_results: 50000
        timeout: "5m"
        labels:
          team: "analytics"
          environment: "production"
          cost_center: "engineering"
        default_dataset:
          project_id: "data-warehouse-project"
          dataset_id: "analytics"
        # Large analytics scan — route through the Storage Read backend
        # to skip per-row Tuple decoding on the way to Arrow.
        use_storage_read: true

    - convert:
        name: arrow_to_json
        target_format: json

    - iterate:
        name: split_rows

    - log:
        name: log
        level: info
