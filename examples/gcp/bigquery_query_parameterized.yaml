# Poll completed orders every 5 minutes with a parameterised query.
# SQL is loaded from a resource file; parameters bind as @param_name.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
#   - resources/gcp/queries/fetch_completed_orders.sql (uses @status, @start_date)
flow:
  name: bigquery_query_parameterized
  require_leader_election: true
  tasks:

    - generate:
        name: generate_jobs
        interval: 300s

    - gcp_bigquery_query:
        name: fetch_completed_orders
        credentials_path: /etc/gcp/credentials.json
        project_id: my-project-id
        query:
          resource: "gcp/queries/fetch_completed_orders.sql"
        parameters:
          status: "completed"
          start_date: "2024-01-01"
        max_results: 10000
        timeout: "1m"

    - convert:
        name: arrow_to_json
        target_format: json

    - iterate:
        name: split_rows

    - log:
        name: log
        level: info
        structured: false
