# Read a historical BigQuery snapshot via Storage Read with column
# projection, server-side row filter, sampling, and time travel.
# Uses cross-project billing.
#
# Required:
#   - GCP service account at /etc/gcp/credentials.json
flow:
  name: bigquery_storage_read_advanced
  require_leader_election: true
  tasks:

    - generate:
        name: trigger
        interval: 10s
        count: 1

    # `snapshot_time` reads the table as it existed at that timestamp.
    # `sample_percentage` returns roughly N% of rows for testing/analysis.
    - gcp_bigquery_storage_read:
        name: read_historical_snapshot
        credentials_path: /etc/gcp/credentials.json
        project_id: data-warehouse-project
        job_project_id: billing-project
        dataset_id: analytics
        table_id: transactions
        selected_fields:
          - transaction_id
          - user_id
          - amount
          - currency
          - transaction_date
        row_restriction: "amount > 100 AND currency = 'USD'"
        sample_percentage: 10.0
        snapshot_time: "2024-01-15T12:00:00Z"
        max_stream_count: 8
        preferred_min_stream_count: 2
        compression_codec: lz4
        data_format: arrow
        retry:
          max_attempts: 5
          max_delay: "30s"

    # Group RecordBatches before conversion.
    - buffer:
        name: batch_records
        size: 1000
        timeout: "30s"

    - convert:
        name: arrow_to_json
        target_format: json

    - iterate:
        name: split_rows

    - log:
        name: log
        level: info
        structured: false
