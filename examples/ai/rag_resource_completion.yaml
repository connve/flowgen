# Webhook → LLM completion with RAG. `static_context` is loaded once at
# init and stitched into every request; the LLM has access to the
# tool sandbox for retrieval or computation.
#
# Required:
#   - OpenAI API key at /etc/openai/credentials.json
#   - resources/prompts/rag_system.md
#   - resources/context/product_documentation.md
#   - resources/context/pricing_info.md
#   - resources/context/support_info.txt
flow:
  name: rag_resource_completion
  tasks:

    # POST /api/flowgen/workers/webhook/ask_question with { "question": "..." }
    - http_endpoint:
        name: receive_question
        path: /ask_question

    # Static context strings are loaded once at init.
    - ai_completion:
        name: answer_with_rag
        provider: openai
        model: gpt-4-turbo
        credentials_path: /etc/openai/credentials.json
        system_prompt:
          resource: "prompts/rag_system.md"
        prompt: "Question: {{event.data.question}}"
        static_context:
          - resource: "context/product_documentation.md"
          - resource: "context/pricing_info.md"
          - resource: "context/support_info.txt"
          - "Inline context also works: Company founded in 2024."
        temperature: 0.3
        max_tokens: 800
        max_turns: 3
        sandbox:
          memory_limit_mb: 512
          time_limit_seconds: 30
          max_pids: 10
          allow_network: false
