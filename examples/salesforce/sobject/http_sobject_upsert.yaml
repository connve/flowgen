# Upsert a Salesforce record by external ID.
#
# Accepts record data via webhook, upserts into Salesforce, and returns
# the result. Swap http_endpoint for mcp_tool to expose as an MCP tool.
#
# Required:
#   - /etc/sfdc/credentials.json
flow:
  labels:
    display_name: "Salesforce Record Upsert (HTTP)"
    description: "Accepts record data over an HTTP webhook and upserts it into Salesforce by external ID via the REST API."
    tags: ["salesforce", "upsert", "http", "webhook", "example"]
  tasks:

    - http_endpoint:
        name: receive_request
        method: POST
        endpoint: /salesforce/upsert

    - salesforce_restapi_sobject:
        name: upsert_record
        operation: upsert
        credentials_path: /etc/sfdc/credentials.json
        sobject_type: "{{event.data.sobject_type}}"
        external_id_field: "{{event.data.external_id_field}}"
        external_id_value: "{{event.data.external_id_value}}"
        # Override Salesforce duplicate-detection rules per request
        # (header: Sforce-Duplicate-Rule-Header: allowSave=true). Most
        # tenants need this on Account / Lead / Contact, where the
        # default rule action is "Block" — without it, creates and
        # updates that match an existing record silently fail.
        allow_duplicate_save: true
        payload:
          from_event: true
