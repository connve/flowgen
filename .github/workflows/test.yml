name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-rust-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Reads channel + components from `rust-toolchain.toml`.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    # Node is required by `flowgen/app/build.rs` — see docker/Dockerfile.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Add rustfmt and build
      run: |
        rustup component add rustfmt
        cargo build --verbose
        cargo test --verbose
        cargo fmt --all

  test-rust-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Explicit nightly override — `rust-toolchain.toml` pins stable, but
    # this job intentionally exercises the nightly channel.
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Add rustfmt and build
      run: |
        rustup component add rustfmt
        cargo build --verbose
        cargo test --verbose
        cargo fmt --all

  # Enforces the `rust-version` (MSRV) declared in `Cargo.toml` by
  # compiling the workspace with that exact toolchain. Without this
  # job the field is a promise, not a contract — a dependency bump
  # that raises the minimum silently would only be caught by a
  # downstream consumer building on an older Rust.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Compile with MSRV
      run: cargo +1.88 check --workspace --locked --verbose

  # Runs every `#[ignore]`-marked integration test in the workspace.
  # These spin up real containers via testcontainers (NATS JetStream,
  # OCI registry, ...) so they are gated behind `--ignored` to keep
  # the main unit-test job fast and image-pull-hiccup-free.
  test-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Reads channel + components from `rust-toolchain.toml`.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Run integration tests
      env:
        FLOWGEN_SKIP_WEB_BUILD: "1"
      run: cargo test --workspace --tests -- --ignored --nocapture

  # Renders the flowgen Helm chart with `helm template` and asserts on
  # the resulting manifests. Split out because the crate shells out to
  # the `helm` binary, which is not needed by the rest of the workspace.
  test-helm-chart:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0
    - name: Run helm chart tests
      run: cargo test -p flowgen-chart-tests