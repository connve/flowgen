[tools]
node = "22"
protoc = "33"
helm = "3"
kind = "0.30"
kubectl = "1.34"
"cargo:cargo-audit" = "0.22"

[tasks.setup]
description = "Enable the pre-commit hook and install the MSRV toolchain"
run = [
  "git config --local core.hooksPath .githooks",
  "rustup toolchain install 1.88 --profile minimal",
]

[tasks.msrv]
description = "Check the workspace builds with the minimum supported Rust version"
run = "cargo +1.88 check --workspace --all-targets"
