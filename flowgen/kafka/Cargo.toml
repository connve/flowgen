[package]
name = "flowgen_kafka"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "flowgen_kafka"
path = "src/lib.rs"

[dependencies]
rdkafka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
flowgen_core = { path = "../core" }
async-trait = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio-retry = { workspace = true }
bytes = { workspace = true }
arrow = { workspace = true }
humantime-serde = { workspace = true }
uuid = { workspace = true }

# Build OpenSSL from source on macOS: pkg-config cannot find it when
# cross-compiling Intel binaries on ARM runners, and the shipped binary
# must not depend on Homebrew's openssl at runtime.
[target.'cfg(target_os = "macos")'.dependencies]
rdkafka = { workspace = true, features = ["ssl-vendored"] }

[dev-dependencies]
testcontainers = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
