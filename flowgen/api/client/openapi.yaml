openapi: 3.0.3
info:
  title: Flowgen API
  description: |
    HTTP API for flowgen. Two listeners: `web` (flow / resource /
    SSE endpoints under `web.path`) and `health` (Kubernetes probes
    on the root path).
  version: 0.160.0
  license:
    name: MPL-2.0
servers:
  - url: http://localhost:8080
    description: Local web API (web listener)
  - url: http://localhost:8081
    description: Local health listener
paths:
  /api/flows:
    get:
      operationId: listFlows
      summary: List every loaded flow.
      description: Sorted alphabetically by name.
      tags: [flows]
      responses:
        "200":
          description: One entry per loaded flow.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowSummary"

  /api/flows/{path}:
    get:
      operationId: getFlow
      summary: Fetch the full source YAML for one flow.
      description: The `{path}` parameter is greedy and matches slashes.
      tags: [flows]
      parameters:
        - name: path
          in: path
          required: true
          description: Flow identity (see `FlowSummary.path`).
          schema:
            type: string
      responses:
        "200":
          description: Flow detail including raw YAML source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDetail"
        "404":
          description: No flow with that name is loaded.
          content:
            text/plain:
              schema:
                type: string

  /api/flows/stream:
    get:
      operationId: streamFlows
      summary: Live flow metrics stream.
      description: |
        Server-Sent Events with a single named event type `snapshot` (an
        object keyed by flow identity containing the current metrics for
        every known flow), sent once on connect and again whenever any
        flow's counters change. Event/log history and live tail for a
        flow come from `/api/logs` and `/api/logs/stream` (with `flow`
        set) — the same source the global `/logs` viewer uses — not from
        this endpoint.
      tags: [flows]
      responses:
        "200":
          description: Long-lived event stream.
          content:
            text/event-stream:
              schema:
                type: string

  /api/resources:
    get:
      operationId: listResources
      summary: List every resource discoverable by the resource loader.
      tags: [resources]
      responses:
        "200":
          description: One entry per resource (filesystem, cache and system resources combined).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceSummary"

  /api/resources/{key}:
    get:
      operationId: getResource
      summary: Fetch one resource's raw text content.
      description: The `{key}` path parameter is greedy and matches slashes.
      tags: [resources]
      parameters:
        - name: key
          in: path
          required: true
          description: Resource key relative to the loader's base path.
          schema:
            type: string
      responses:
        "200":
          description: Full text content of the resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceContent"
        "404":
          description: Resource not found in filesystem or cache.
          content:
            text/plain:
              schema:
                type: string

  /api/logs:
    get:
      operationId: listLogs
      summary: Log record snapshot, optionally scoped to one flow.
      description: |
        Returns log records retained by the telemetry backend, including
        framework, lifecycle, and per-task activity records. The per-flow
        Activity panel calls this with `flow` set to backfill its history
        from the same source the global `/logs` viewer uses (unscoped).
      tags: [logs]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (most recent first).
          schema:
            type: integer
            minimum: 1
            default: 500
        - name: flow
          in: query
          required: false
          description: Restrict to one flow's records, by flow identity.
          schema:
            type: string
        - name: levels
          in: query
          required: false
          description: Levels to keep, one parameter each, e.g. `levels=warn&levels=error`. Omitted keeps every level; `limit` counts only kept records.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LogLevel"
      responses:
        "200":
          description: Retained framework logs, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogRecord"

  /api/logs/stream:
    get:
      operationId: streamLogs
      summary: Live log stream, optionally scoped to one flow.
      description: |
        Server-Sent Events with a single named event type `log` carrying
        one `LogRecord` per frame. Unscoped, this emits every captured
        record; the web UI passes `levels` and applies free-text filters
        client-side, and the per-flow Activity panel passes `flow` so it
        only receives that flow's live records.
      tags: [logs]
      parameters:
        - name: flow
          in: query
          required: false
          description: Restrict to one flow's records, by flow identity.
          schema:
            type: string
        - name: levels
          in: query
          required: false
          description: Levels to keep, one parameter each, e.g. `levels=warn&levels=error`. Omitted keeps every level.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LogLevel"
      responses:
        "200":
          description: Long-lived event stream.
          content:
            text/event-stream:
              schema:
                type: string

  /api/connections:
    get:
      operationId: listConnections
      summary: External systems the loaded flows connect to, with their status.
      description: |
        One entry per connector and credentials file, gathered from the loaded
        flows' task configs and from `ai_completion` MCP servers. Status comes
        from the latest log records of the tasks using it.
      tags: [connections]
      responses:
        "200":
          description: Connections sorted by connector, then credentials file.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /api/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getConnection
      summary: Fetch one connection.
      tags: [connections]
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          description: No loaded flow uses a connection with that id.

  /api/connectors:
    get:
      operationId: listConnectors
      summary: Every connector with the task types its crate declares.
      tags: [connections]
      responses:
        "200":
          description: Connectors sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"

  /api/connectors/{name}/icon:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getConnectorIcon
      summary: The connector's logo, as declared by its crate.
      tags: [connections]
      responses:
        "200":
          description: An SVG or PNG image.
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No connector with that name.

  /api/cluster:
    get:
      operationId: getClusterStatus
      summary: Every pod behind the web UI, with reachability and flow count.
      description: |
        With the `memory` telemetry backend and the cache, the serving pod
        checks every registered pod; logs and flow counters of an
        unreachable pod are missing from `/api/logs`, `/api/flows`, and
        their streams. Otherwise only the serving pod is listed.
      tags: [meta]
      responses:
        "200":
          description: Pods as seen from the serving pod.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"

  /api/cluster/token:
    post:
      operationId: regenerateClusterToken
      summary: Replace the token pods use to reach each other.
      description: |
        Available in cluster mode: the `memory` telemetry backend with the
        cache. Generates a new
        random token in the system cache, e.g. after the current one
        leaked. Every pod switches to it within 30 seconds; until then,
        some pods may miss others' logs and counters.
      tags: [meta]
      responses:
        "204":
          description: The token was replaced.
        "404":
          description: Cluster mode is off.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: The token could not be written to the cache.
          content:
            text/plain:
              schema:
                type: string

  /api/version:
    get:
      operationId: getVersion
      summary: Return the running flowgen build version.
      tags: [meta]
      responses:
        "200":
          description: Build version derived from `CARGO_PKG_VERSION`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  /api/config:
    get:
      operationId: getConfig
      summary: Return the running application configuration.
      description: |
        The loaded `AppConfig` serialized to YAML, read-only. Secret
        values (JWT HMAC keys) are redacted to `"***"` before
        serialization; file paths, URLs, ports, and other non-secret
        settings are shown verbatim.
      tags: [meta]
      responses:
        "200":
          description: Redacted application configuration as YAML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigInfo"

  /api/agents/models:
    get:
      operationId: agentsModels
      summary: List models available on the AI gateway.
      description: |
        Proxies the AI gateway model list so the Agents chat can populate
        its model selector without knowing the gateway URL. Returns the
        stock OpenAI `{ object: "list", data: [{ id, ... }] }` shape.
      tags: [agents]
      responses:
        "200":
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "404":
          description: "`web.agents` is not enabled."
        "502":
          description: The AI gateway could not be reached.
        "503":
          description: No AI gateway is configured.

  /api/agents/tools:
    get:
      operationId: listAgentTools
      summary: List the MCP tools flows register, with the connectors each reaches.
      tags: [agents]
      responses:
        "200":
          description: One entry per `mcp_tool` task.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTool"
        "404":
          description: "`web.agents` is not enabled."

  /api/agents/sessions:
    get:
      operationId: listSessions
      summary: List stored Agents chat sessions.
      description: |
        Returns session summaries (no message bodies) for the built-in
        Agents chat, newest first. History is our UI's own store in the
        configured system cache — the gateway proxy stays stateless. A
        persistence flow can copy these into a database for long-term
        retention.
      tags: [agents]
      responses:
        "200":
          description: Session summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
        "404":
          description: "`web.agents` is not enabled."
        "503":
          description: The session store is unavailable.

  /api/agents/sessions/stream:
    get:
      operationId: streamSessions
      summary: Live Agents chat sessions.
      description: |
        Server-Sent Events with the sessions `GET /api/agents/sessions`
        lists: a `sessions` event with every `SessionSummary` on
        connect, then a `session` event with one `SessionSummary`
        for each created or changed session and a `removed` event with
        the id of each deleted or expired one.
      tags: [agents]
      responses:
        "200":
          description: Long-lived event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: "`web.agents` is not enabled."
        "503":
          description: The session store is unavailable.

  /api/agents/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Client-supplied session id (`[A-Za-z0-9_-]+`, not `stream`).
        schema:
          type: string
    get:
      operationId: getSession
      summary: Fetch one session with its full message history.
      tags: [agents]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The session id is invalid.
        "404":
          description: No session with that id, or `web.agents` is not enabled.
        "503":
          description: The session store is unavailable.
    put:
      operationId: putSession
      summary: Create or overwrite a session.
      description: |
        The path id is authoritative and `updatedAt` is server-stamped, so
        neither is read from the body. The TTL
        (`web.agents.session_history_ttl`) is refreshed on every write,
        so the expiry window counts from the last activity.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpsert"
      responses:
        "204":
          description: The session was stored.
        "400":
          description: The session id is invalid.
        "404":
          description: "`web.agents` is not enabled."
        "503":
          description: The session store is unavailable.
    patch:
      operationId: updateSession
      summary: Rename a session or move it to a folder.
      description: |
        `updatedAt` and the unread state stay as they are, so the
        session keeps its place in the list.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "204":
          description: The session was updated.
        "400":
          description: The session id or the title is invalid.
        "404":
          description: No session with that id, or `web.agents` is not enabled.
        "500":
          description: Corrupt session — the stored session can't be read.
        "503":
          description: The session store is unavailable.
    delete:
      operationId: deleteSession
      summary: Delete a session.
      description: |
        Deletes it with the caller's read state and folder, and with every
        user's for a shared session. Idempotent — deleting a missing id
        still succeeds.
      tags: [agents]
      responses:
        "204":
          description: The session is gone.
        "400":
          description: The session id is invalid.
        "404":
          description: "`web.agents` is not enabled."
        "503":
          description: The session store is unavailable.

  /api/agents/sessions/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        description: Session id; a new id starts a session.
        schema:
          type: string
    post:
      operationId: startReply
      summary: Send a message and have the agent reply.
      description: |
        Adds the user's message to the session and starts the agent's
        reply on the server, so it goes on when the browser leaves. The
        reply is saved into the session as it arrives and at least every
        `web.agents.reply_save_interval`; follow it with `GET`. A reply not
        saved for ten save intervals counts as interrupted, and a new message
        settles it. The reply ends with an `error` when the AI gateway fails,
        sends nothing for `web.agents.reply_idle_timeout`, or ends its stream
        before the agent finished.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "202":
          description: The reply started.
        "400":
          description: The session id is invalid or the message is empty.
        "404":
          description: "`web.agents` is not enabled."
        "409":
          description: The session already has a reply in progress, on this or another pod.
        "500":
          description: Corrupt session — the stored session can't be read.
        "503":
          description: The session store or the AI gateway is unavailable.
    get:
      operationId: followReply
      summary: Follow the reply in progress.
      description: |
        Server-Sent Events of the reply this pod is writing: a `message`
        event with the `SessionMessage` so far on connect, then one per
        change, the last without `pending`.
      tags: [agents]
      responses:
        "200":
          description: Long-lived event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: The session id is invalid.
        "404":
          description: |
            The caller has no session with that id, no reply is in
            progress on this pod, or `web.agents` is not enabled.
        "503":
          description: The session store is unavailable.
    delete:
      operationId: stopReply
      summary: Stop the reply in progress.
      description: |
        A reply another pod writes is marked stopped in the session, and
        that pod stops at its next save.
      tags: [agents]
      responses:
        "204":
          description: The reply stopped.
        "400":
          description: The session id is invalid.
        "404":
          description: |
            The caller has no session with that id, no reply is in
            progress, or `web.agents` is not enabled.
        "500":
          description: Corrupt session — the stored session can't be read.
        "503":
          description: The session store is unavailable.

  /api/agents/sessions/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        description: Session id.
        schema:
          type: string
    put:
      operationId: markSessionRead
      summary: Mark a session read for the caller.
      description: Other users' unread state doesn't change.
      tags: [agents]
      responses:
        "204":
          description: The session is read for the caller.
        "400":
          description: The session id is invalid.
        "404":
          description: No session with that id, or `web.agents` is not enabled.
        "503":
          description: The session store is unavailable.
    delete:
      operationId: markSessionUnread
      summary: Mark a session unread for the caller.
      description: Other users' unread state doesn't change.
      tags: [agents]
      responses:
        "204":
          description: The session is unread for the caller.
        "400":
          description: The session id is invalid.
        "404":
          description: No session with that id, or `web.agents` is not enabled.
        "503":
          description: The session store is unavailable.

  /api/credentials/encrypt:
    post:
      operationId: encryptCredential
      summary: Encrypt a credential as a workspace file, ready to propose.
      description: |
        Encrypts `content` with SOPS for the configured age recipients into
        `credentials/<name>.yaml`, a Kubernetes Secret holding the file
        `<name>.json`. Nothing is stored; propose the returned file as a
        change. The plaintext is not logged.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: The encrypted file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        "400":
          description: The name, content or form is invalid.
        "404":
          description: "`credentials` is not configured."
        "500":
          description: Encrypting failed.

  /api/workspace/validate:
    post:
      operationId: validateWorkspaceFiles
      summary: Validate flow and resource files without running them.
      description: |
        Paths are relative to the workspace root: `flows/…` files are parsed
        and checked as flows (unknown fields, task wiring, task settings,
        inline scripts), `resources/…` files by extension (`.rhai` must
        compile, `.json` must parse).
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceFiles"
      responses:
        "200":
          description: Issues per file; an empty list means every file is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceValidation"
        "500":
          description: Validating the files stopped unexpectedly.

  /api/workspace/test:
    post:
      operationId: testScript
      summary: Run a Rhai script on sample events without deploying it.
      description: |
        Runs the script as the `script` task runs it, on each sample as
        `event.data`, with an in-memory `ctx.cache`. Its imports resolve in
        the `resources/…` files of the request first, then in the deployed
        resources.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptTest"
      responses:
        "200":
          description: One outcome per sample, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptTestResult"
        "400":
          description: No samples or more than 100, an invalid draft path, a script that could not start, or a test past 30 seconds.

  /api/docs:
    get:
      operationId: listDocs
      summary: The docs pages of this version.
      description: |
        Embedded in the binary, so they describe the tasks it runs; the same
        pages as the docs site's `llms.txt`.
      tags: [workspace]
      responses:
        "200":
          description: The pages, by path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocPages"

  /api/docs/{page}:
    get:
      operationId: readDoc
      summary: One docs page as Markdown.
      description: The `{page}` path parameter is greedy and matches slashes.
      tags: [workspace]
      parameters:
        - name: page
          in: path
          required: true
          description: The page's path, such as `object-store/object-store`.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocContent"
        "404":
          description: No page at that path.

  /api/hubs:
    get:
      operationId: listHubs
      summary: The hubs new flows and resources can start from.
      description: |
        One per flow `system/<hub>_hub` running on this instance, named by its
        `display_name`.
      tags: [workspace]
      responses:
        "200":
          description: The hubs, by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hubs"

  /api/hubs/{hub}/templates:
    parameters:
      - name: hub
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listHubTemplates
      summary: The templates of a hub.
      description: |
        Calls the hub's flow, `system/<hub>_hub`, and groups the files it
        returns by their top folder: each folder with a `template.yaml` is a
        template holding its `flows/` and `resources/` files. Nothing is
        stored; a template becomes a change like any other.
      tags: [workspace]
      responses:
        "200":
          description: The hub's templates, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubTemplates"
        "404":
          description: No hub with that id runs on this instance.
        "502":
          description: The hub's flow failed, such as when its catalog cannot be pulled.

  /api/workspace/templates:
    get:
      operationId: listInstalledTemplates
      summary: The templates the workspace installed.
      description: |
        Read from the deployed `flowgen.lock`, without calling a hub, so a
        file's template is known at once.
      tags: [workspace]
      responses:
        "200":
          description: The installed templates, by hub and slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledTemplates"

  /api/schemas/flow:
    get:
      operationId: getFlowSchema
      summary: The JSON Schema of a flow file.
      description: |
        Generated from the task configs of this version. Fields carry hints
        for forms: `x-widget` (`credentials`, `source`), `x-advanced` and
        `x-hidden`; a duration is a string with `format: duration`.
      tags: [workspace]
      responses:
        "200":
          description: A JSON Schema (draft 2020-12).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspace/file:
    get:
      operationId: getWorkspaceFile
      summary: The version of a file a change to it is based on.
      description: |
        What the instance runs, with every committed change that is not
        deployed yet applied on top, so an edit made right after an approval
        builds on that commit. `content` is null when the file does not exist.
      tags: [workspace]
      parameters:
        - name: path
          in: query
          required: true
          description: Path from the workspace root, under `flows/` or `resources/`.
          schema:
            type: string
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        "400":
          description: The path is invalid.
        "404":
          description: "`web.authoring` is not configured."
        "503":
          description: The change store or the deployed content is unavailable.

  /api/changes:
    get:
      operationId: listChanges
      summary: List proposed workspace changes, newest first.
      tags: [workspace]
      responses:
        "200":
          description: Change summaries.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChangeSummary"
        "404":
          description: "`web.authoring` is not configured."
        "503":
          description: The change store is unavailable.
    post:
      operationId: proposeChange
      summary: Propose a workspace change for approval.
      description: |
        Records the change as pending together with the deployed content of
        every file it touches, so the diff shows exactly what approval
        replaces. Invalid files are recorded too, with their issues.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeProposal"
      responses:
        "201":
          description: The recorded change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          description: |
            The title is blank, the change has no files, a path is listed
            twice, a path is outside `flows/` and `resources/` or has a
            segment with characters other than letters, digits, `.`, `_` and
            `-`, a path is outside every `web.authoring.targets` entry, or the
            files span several targets.
        "404":
          description: "`web.authoring` is not configured."
        "500":
          description: Validating or diffing the files stopped unexpectedly.
        "503":
          description: The change store is unavailable, or the deployed content of a file cannot be read.

  /api/changes/stream:
    get:
      operationId: streamDeployments
      summary: Releases and deployments as they happen.
      description: |
        Server-Sent Events: a `deployment` event each time a commit is
        released, a flow starts or stops, or a resource that flowgen loads
        from the cache changes, after which the `deployment` of committed
        changes may have moved on.
      tags: [changes]
      responses:
        "200":
          description: Long-lived event stream.
          content:
            text/event-stream:
              schema:
                type: string

  /api/changes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getChange
      summary: Fetch one change with its diff.
      tags: [workspace]
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "404":
          description: No change with that id, or `web.authoring` is not configured.
        "500":
          description: Diffing the files stopped unexpectedly.
        "503":
          description: The change store is unavailable.
    patch:
      operationId: editChange
      summary: Edit the title or description of a pending change.
      description: |
        Only its proposer may edit it; without `web.auth`, anyone. Fields left
        out stay as they are.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEdit"
      responses:
        "200":
          description: The edited change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          description: The title is blank.
        "403":
          description: The caller did not propose the change.
        "404":
          description: No change with that id, or `web.authoring` is not configured.
        "409":
          description: The change is no longer pending, or was edited by another request.
        "503":
          description: The change store is unavailable.

  /api/changes/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addChangeFiles
      summary: Add files to a pending change, or replace files it already has.
      description: |
        Only its proposer may add files; without `web.auth`, anyone. Every
        file must belong to the change's target. A replaced file keeps the
        deployed content recorded when it was first added, so committing
        fails when the file changed since. All files are validated again.
        A `template` replaces the change's entry for the same template.
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeFiles"
      responses:
        "200":
          description: The change with the files added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          description: A path is invalid, listed twice, or outside the change's target.
        "403":
          description: The caller did not propose the change.
        "404":
          description: No change with that id, or `web.authoring` is not configured.
        "409":
          description: The change is no longer pending, or was edited by another request.
        "503":
          description: The change store or the deployed content is unavailable.
    delete:
      operationId: removeChangeFile
      summary: Take a file out of a pending change.
      description: |
        Only its proposer may remove files; without `web.auth`, anyone. A file
        of a template in the change goes with the template and its other
        files. A change left without files is rejected.
      tags: [workspace]
      parameters:
        - name: path
          in: query
          required: true
          description: The workspace path of the file.
          schema:
            type: string
      responses:
        "200":
          description: The change without the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          description: The `path` query parameter is missing.
        "403":
          description: The caller did not propose the change.
        "404":
          description: No change with that id or no such file in it, or `web.authoring` is not configured.
        "409":
          description: The change is no longer pending, or was edited by another request.
        "503":
          description: The change store is unavailable.

  /api/changes/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: updatedAt
        in: query
        required: false
        description: The change's `updatedAt` as reviewed; approving fails when it was edited since.
        schema:
          type: integer
          format: int64
    post:
      operationId: approveChange
      summary: Approve a pending change and commit it, or commit a failed one again.
      description: |
        With `web.auth` set, requires a signed-in user's session; machine
        keys are refused. When the change's target sets
        `web.authoring.targets[].approver_groups`, the user must be in one of
        them. The change's files must still belong to the target it was
        proposed for under the current `web.authoring.targets`.

        Calls the target's `web.authoring.targets[].commit_flow` with
        `{id, target, title, author: {name, email}, files: [{path, content, previous}]}`
        and records its result. `author` comes from the approver's `name` and
        `email` claims, else their user id; `content` null deletes the file
        and `previous` null marks a new one. A `failed` change, or one left
        `committing` past the `ack_timeout` of the commit flow's
        `inproc_endpoint`, can be approved again.
      tags: [workspace]
      responses:
        "200":
          description: The change after committing, `committed` or `failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "403":
          description: |
            The request does not carry a user session, or the user is in none
            of the target's `approver_groups`.
        "404":
          description: No change with that id, or `web.authoring` is not configured.
        "409":
          description: |
            The change cannot be approved in its status (including
            `committing` before the commit flow's `ack_timeout` passed), has
            invalid files, was decided by another request, was edited after
            `updatedAt`, or its files no longer belong to the target it was
            proposed for.
        "500":
          description: Committing stopped unexpectedly, or the change could not be encoded or diffed.
        "503":
          description: The change store is unavailable.

  /api/changes/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectChange
      summary: Reject a pending or failed change.
      description: |
        Requires an approver, as approving does: with `web.auth` set, a
        signed-in user's session (machine keys are refused) and membership of
        one of the target's `web.authoring.targets[].approver_groups` when
        set. The change's files must still belong to the target it was
        proposed for.
      tags: [workspace]
      responses:
        "200":
          description: The rejected change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "403":
          description: |
            The request does not carry a user session, or the user is in none
            of the target's `approver_groups`.
        "404":
          description: No change with that id, or `web.authoring` is not configured.
        "409":
          description: |
            The change is not pending or failed, was decided by another
            request, or its files no longer belong to the target it was
            proposed for.
        "500":
          description: The change could not be encoded or diffed.
        "503":
          description: The change store is unavailable.

  /auth/login:
    get:
      operationId: authLogin
      summary: Starts web UI login.
      description: |
        Redirects to the configured OIDC identity provider. 404 when
        `web.auth` is not configured.
      tags: [auth]
      parameters:
        - name: return_to
          in: query
          description: |
            Web UI page to return to after signing in, e.g.
            `/flowgen/changes/abc`. Ignored unless it is a path under
            `web.path` outside `/auth/`, without `.` or `..` segments; the
            callback then redirects to the web UI's root.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the identity provider.
        "404":
          description: OIDC login is not configured.

  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC redirect target.
      description: |
        Exchanges the authorization code for tokens, verifies state/nonce,
        and sets the session cookie. Not meant to be called directly —
        the identity provider redirects here after `/auth/login`.
      tags: [auth]
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        "302":
          description: |
            Redirects back into the web UI once signed in, or to its login page
            with `?error=` when signing in failed: `access_denied` when the
            provider refused the user, `provider` for another provider error,
            `expired` when the sign-in took too long, `failed` when the
            response could not be verified.
        "404":
          description: OIDC login is not configured.

  /auth/logout:
    get:
      operationId: authLogout
      summary: Clears the local session cookie and redirects.
      description: |
        Navigated to, not fetched — the browser follows the redirect chain
        itself. Redirects to `web.auth.signout_redirect_url` when set (with
        `id_token_hint` appended), ending the identity provider's session as
        well; otherwise back to the web UI, having cleared flowgen's session
        only.
      tags: [auth]
      responses:
        "303":
          description: Signed out; continue to the provider or the web UI.
          headers:
            Location:
              schema:
                type: string
        "404":
          description: OIDC login is not configured.

  /auth/me:
    get:
      operationId: authMe
      summary: The signed-in user.
      description: |
        Validates the session, silently refreshing it against the identity
        provider once past `exp` — the same check `/api/*` applies, so a
        caller that gets 200 here will not be rejected a moment later.

        404 when `web.auth` is not configured — distinct from 401 (not
        signed in) so callers can tell "no login offered" apart from
        "not logged in yet".
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContext"
        "401":
          description: Not signed in.
        "404":
          description: OIDC login is not configured.

  /livez:
    get:
      operationId: livez
      summary: Kubernetes liveness probe.
      description: Always returns 200 while the health listener is running.
      tags: [health]
      responses:
        "200":
          description: Process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /readyz:
    get:
      operationId: readyz
      summary: Kubernetes readiness probe.
      description: Returns 200 once at least one flow is registered, 503 before.
      tags: [health]
      responses:
        "200":
          description: Ready to serve.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "503":
          description: Not ready — no flows registered yet.
          content:
            text/plain:
              schema:
                type: string
                example: not ready

  /healthz:
    get:
      operationId: healthz
      summary: Alias of `/livez`.
      tags: [health]
      responses:
        "200":
          description: Process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: OK

components:
  schemas:
    Connection:
      type: object
      required: [id, connector, targets, perEvent, onBehalfOfUser, flows, status, credentialsFound]
      properties:
        id:
          type: string
          description: Stable id derived from the connector and credentials file, or the target without one.
        credentialsName:
          type: string
          description: |
            The credentials it reads, by the file name of its credentials
            path: `orders-api` for any `…/orders-api.json`. They can be added
            or replaced in the web UI as `credentials/<name>.yaml`; absent for
            a path set per event.
        credentialsFound:
          type: boolean
          description: Whether its credentials file, or the encrypted Secret holding it, is there; true without a credentials file.
        connector:
          type: string
          description: The connector of the task types using it, such as `http`, or `mcp` for an `ai_completion` MCP server.
        credentialsPath:
          type: string
          description: The credentials file; absent when the config sets none.
        account:
          type: string
          description: The account or instance the credentials file points to, such as an instance host or a service account email.
        targets:
          type: array
          description: Where its tasks connect, from their configs, such as hosts or an AI provider and model.
          items:
            type: string
        perEvent:
          type: boolean
          description: Whether a task sets the target or the credentials per event.
        onBehalfOfUser:
          type: boolean
          description: Whether a task calls it as the signed-in user, with their token.
        flows:
          type: array
          description: Identities of the flows using it.
          items:
            type: string
        status:
          $ref: "#/components/schemas/FlowStatus"

    Connector:
      type: object
      required: [name, label, taskTypes, credentials]
      properties:
        name:
          type: string
          description: Such as `http`.
        label:
          type: string
          description: Display name, such as `HTTP`.
        taskTypes:
          type: array
          description: YAML tags of its task types, such as `http_request`.
          items:
            type: string
        credentials:
          type: array
          description: The ways to fill its credentials file; empty without one.
          items:
            $ref: "#/components/schemas/CredentialsForm"

    CredentialsForm:
      type: object
      required: [label, fields]
      properties:
        label:
          type: string
          description: Such as `API key` or `Service account file`.
        fields:
          type: array
          description: The values making up the file; empty when the whole file is uploaded.
          items:
            $ref: "#/components/schemas/CredentialsField"

    CredentialsField:
      type: object
      required: [key, label, kind, required]
      properties:
        key:
          type: string
          description: Where it goes in the file, with `.` between nested keys.
        label:
          type: string
        kind:
          type: string
          enum: [text, url, secret, number, boolean, choice, list]
          description: "`url` is an `http` or `https` URL; `secret` is masked; `list` takes one value per line."
        choices:
          type: array
          description: The values a `choice` takes.
          items:
            type: string
        checked:
          type: boolean
          default: false
          description: Whether a `boolean` starts checked.
        required:
          type: boolean

    FlowSummary:
      type: object
      description: Registry entry combined with tracing-derived counters.
      required:
        - path
        - name
        - display_name
        - description
        - tags
        - require_leader_election
        - task_count
        - source
        - started_at
        - last_event_at
        - last_warning_at
        - last_error_at
        - events_total
        - warnings_total
        - errors_total
        - status
      properties:
        path:
          type: string
          description: |
            Identity of the flow. Filesystem-loaded flows use the path
            relative to `flows.path` with the extension stripped
            (e.g. `demo/nba_email_demo`); cache-loaded flows use the
            KV key suffix after `flowgen.flows.`. Root-level flows
            have no `/`.
        name:
          type: string
          description: |
            Flow name as declared in the YAML `flow.name` field. Not
            guaranteed to be globally unique — use `path` for identity.
        display_name:
          type: string
          nullable: true
          description: |
            Human-readable name taken from `labels.display_name`. UI
            falls back to `name` when absent.
        description:
          type: string
          nullable: true
          description: Optional description taken from the `description` label.
        tags:
          type: array
          description: Tags taken from the `tags` label array (empty when none).
          items:
            type: string
        require_leader_election:
          type: boolean
          description: Whether the flow requires distributed leader election.
        task_count:
          type: integer
          minimum: 0
          description: Number of tasks in the flow.
        source:
          type: string
          description: Where the config was loaded from.
          enum: [filesystem, cache]
        started_at:
          type: string
          nullable: true
          format: date-time
          description: RFC 3339 timestamp of when the flow supervisor was spawned.
        last_event_at:
          type: string
          nullable: true
          format: date-time
          description: |
            RFC 3339 timestamp of the most recent `info!` inside a
            `task.handle` scope. Null when the flow has never
            processed an event.
        last_warning_at:
          type: string
          nullable: true
          format: date-time
        last_error_at:
          type: string
          nullable: true
          format: date-time
        events_total:
          type: integer
          format: int64
          minimum: 0
        warnings_total:
          type: integer
          format: int64
          minimum: 0
        errors_total:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/FlowStatus"

    FlowStatus:
      type: string
      description: |
        Coarse status derived from the last-seen info / warn / error
        timestamps. Wins by recency — an error after an info stays
        `error` until the next info arrives.
      enum: [idle, ok, warn, error]

    FlowDetail:
      type: object
      required: [path, name, display_name, yaml]
      properties:
        path:
          type: string
          description: Identity of the flow; see `FlowSummary.path`.
        name:
          type: string
        display_name:
          type: string
          nullable: true
        yaml:
          type: string
          description: Raw YAML source of the flow config.

    ResourceSummary:
      type: object
      required: [key, extension, size]
      properties:
        key:
          type: string
          description: Resource key relative to the loader's base path.
        extension:
          type: string
          nullable: true
          description: Filename extension — used by the UI to pick a viewer.
        size:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          description: Size in bytes; null when the resource could not be read.

    ResourceContent:
      type: object
      required: [key, extension, content]
      properties:
        key:
          type: string
        extension:
          type: string
          nullable: true
        content:
          type: string
          description: UTF-8 file contents.

    ClusterStatus:
      type: object
      required: [pods]
      properties:
        pods:
          type: array
          description: Registered pods, the serving pod included, sorted by identity.
          items:
            $ref: "#/components/schemas/PodStatus"

    PodStatus:
      type: object
      required: [identity]
      properties:
        identity:
          type: string
          description: Pod identity.
        address:
          type: string
          description: "`host:port` the pod advertises for the cluster endpoint."
        unreachable_reason:
          type: string
          description: Why its logs and counters are missing from merged views. Absent when present.
        flows:
          type: integer
          minimum: 0
          description: Flows running on the pod. Absent when it is unreachable.

    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          description: Always `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      required: [id, protocol]
      properties:
        id:
          type: string
          description: "`<proxy>/<model>`, or the proxy's name when it declares no models."
        object:
          type: string
        created:
          type: integer
          format: int64
        owned_by:
          type: string
        protocol:
          type: string
          description: Wire protocol the proxy speaks, `openai` or `anthropic`.
        display_name:
          type: string
          description: The proxy flow's `labels.display_name`, when set.
        description:
          type: string
          description: The proxy flow's `labels.description`, when set.

    VersionInfo:
      type: object
      required: [version, container]
      properties:
        version:
          type: string
          description: SemVer version derived from `CARGO_PKG_VERSION`.
        latest:
          type: string
          description: The newest released version, when it is newer than `version`.
        container:
          type: boolean
          description: Whether flowgen runs in a container, updated by its image rather than `flowgen update`.

    ConfigInfo:
      type: object
      required: [yaml, agents, authoring, authoringTargets, credentials]
      properties:
        credentials:
          type: boolean
          description: Whether `credentials` is set, so credentials can be added.
        yaml:
          type: string
          description: |
            The running `AppConfig` serialized to YAML, with secrets
            redacted to `"***"`.
        agents:
          type: boolean
          description: Whether `web.agents` is enabled, so the Agents chat is available.
        authoring:
          type: boolean
          description: Whether `web.authoring` is set, so changes can be proposed.
        authoringTargets:
          type: array
          description: Where changes can be proposed; empty when authoring is off.
          items:
            $ref: "#/components/schemas/AuthoringTarget"

    AuthoringTarget:
      type: object
      required: [name, paths]
      properties:
        name:
          type: string
        paths:
          type: array
          description: |
            Workspace folders the target covers, e.g. `flows/user/`, matched
            on whole path segments. A path covered by several targets belongs
            to the one with the most specific folder.
          items:
            type: string

    UserContext:
      type: object
      description: A resolved identity from the configured OIDC provider.
      required: [user_id, claims]
      properties:
        user_id:
          type: string
          description: Extracted from the `sub` claim (or `web.auth`'s configured claim).
        claims:
          type: object
          additionalProperties: true
          description: All claims from the ID token.

    AgentTool:
      type: object
      description: An MCP tool a flow registers with an `mcp_tool` task.
      required: [name, flow, connectors]
      properties:
        name:
          type: string
          description: The tool name agents call.
        flow:
          type: string
          description: Identity of the flow that registers the tool.
        connectors:
          type: array
          description: Connectors the flow's tasks reach, by name as `/api/connectors` lists them, in task order.
          items:
            type: string

    ToolStep:
      type: object
      description: One tool call an agent made while producing a message.
      required: [name, arguments]
      properties:
        name:
          type: string
          description: The tool's name.
        arguments:
          type: string
          description: The tool call's arguments, as a JSON string.
        run:
          type: string
          description: The correlation_id of the flow run the call started, when the tool is a flow.
        durationMs:
          type: integer
          format: int64
          description: How long the flow run took, from its task logs; saved when the reply ends.
        tasks:
          type: array
          description: The tasks of the flow run in the order they first ran, from their logs; saved when the reply ends.
          items:
            $ref: "#/components/schemas/ToolStepTask"

    ToolStepTask:
      type: object
      description: One task of a tool call's flow run.
      required: [task, count, durationMs, level]
      properties:
        task:
          type: string
        taskType:
          type: string
        count:
          type: integer
          format: int64
          description: How many times the task handled an event in the run.
        durationMs:
          type: integer
          format: int64
          description: The task's `duration_ms`, summed over its events.
        level:
          $ref: "#/components/schemas/LogLevel"

    WorkspaceFile:
      type: object
      description: A file in the workspace; `content` null deletes it.
      required: [path]
      properties:
        path:
          type: string
          description: |
            Path from the workspace root, under `flows/` or `resources/`, in
            segments of letters, digits, `.`, `_` and `-`.
        content:
          type: string
          nullable: true

    CredentialInput:
      type: object
      required: [name, content, connector]
      properties:
        name:
          type: string
          description: Lowercase letters, digits and `-`; flows read the file as `<name>.json`.
        content:
          type: string
          description: The credentials file, as JSON.
        connector:
          type: string
          description: The connector the credentials are for, such as `http`.
        form:
          type: integer
          minimum: 0
          description: Which of the connector's credentials forms made the file; required when it has any.

    WorkspaceFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"

    ChangeFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        template:
          $ref: "#/components/schemas/TemplateSource"

    Hub:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: The hub's name before `_hub` in its flow, `system/<id>_hub`.
        name:
          type: string

    Hubs:
      type: object
      required: [hubs]
      properties:
        hubs:
          type: array
          items:
            $ref: "#/components/schemas/Hub"

    InstalledTemplates:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/InstalledTemplate"

    InstalledTemplate:
      type: object
      required: [hub, slug, digest, files]
      properties:
        hub:
          type: string
          description: The id of the hub it came from.
        slug:
          type: string
          description: Its folder in the hub's catalog.
        digest:
          type: string
          description: The digest of its files when it was installed.
        files:
          type: array
          items:
            type: string
          description: The paths of the files it installed.

    HubTemplate:
      type: object
      required: [slug, name, tags, files, digest]
      properties:
        slug:
          type: string
          description: The template's folder in the catalog.
        name:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        readme:
          type: string
        files:
          type: array
          description: Its `flows/` and `resources/` files, by their path in the workspace.
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        digest:
          type: string
          description: The SHA-256 of its files, as `sha256:<hex>`; it changes when the template does.
        installedDigest:
          type: string
          description: The digest `flowgen.lock` holds for it; absent when it was not installed from the hub.
        installedFiles:
          type: array
          description: The paths of the files `flowgen.lock` holds for it, which an update deletes when the template no longer has them and an uninstall deletes.
          items:
            type: string

    TemplateSource:
      type: object
      description: The hub template a change installs, updates or removes, recorded in `flowgen.lock` when it is committed.
      required: [hub, slug, digest, files]
      properties:
        hub:
          type: string
        slug:
          type: string
        digest:
          type: string
        removed:
          type: boolean
          default: false
          description: The change uninstalls the template, so flowgen.lock drops it.
        files:
          type: array
          description: The paths the template installs; flowgen.lock records those the change writes.
          items:
            type: string

    DocPage:
      type: object
      required: [page, title, summary]
      properties:
        page:
          type: string
          description: The page's path, such as `object-store/object-store`.
        title:
          type: string
        summary:
          type: string
          description: The first sentence of the page.

    DocPages:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/DocPage"

    DocContent:
      type: object
      required: [page, content]
      properties:
        page:
          type: string
        content:
          type: string
          description: The page as Markdown.

    HubTemplates:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/HubTemplate"

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: The file the issue is in.
        location:
          type: string
          description: Where in the file, e.g. `flow.tasks.0.generate.intreval`.
        message:
          type: string

    WorkspaceValidation:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ScriptTest:
      type: object
      required: [script, samples]
      properties:
        script:
          type: string
          description: The Rhai script.
        samples:
          type: array
          description: The `event.data` of each sample event.
          items: {}
        files:
          type: array
          description: Draft files; `resources/…` ones are imported before the deployed resources.
          items:
            $ref: "#/components/schemas/WorkspaceFile"

    ScriptTestOutcome:
      type: object
      properties:
        events:
          type: array
          description: The `event.data` of each event the script emitted.
          items: {}
        error:
          type: string
          description: Why the script failed on the sample.

    ScriptTestResult:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ScriptTestOutcome"

    ChangeProposal:
      type: object
      required: [title, files]
      properties:
        title:
          type: string
          description: One line, used as the commit message; may not be blank.
        description:
          type: string
        files:
          type: array
          description: The files to change, each path at most once.
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        templates:
          type: array
          description: The hub templates the change installs, updates or removes.
          items:
            $ref: "#/components/schemas/TemplateSource"

    ChangeEdit:
      type: object
      properties:
        title:
          type: string
          description: One line, used as the commit message; may not be blank.
        description:
          type: string

    ChangeStatus:
      type: string
      enum: [pending, rejected, committing, committed, failed]

    ChangeDeployment:
      type: string
      enum: [waiting, released, deployed]
      description: |
        Where a committed change is on its way to this instance: `waiting`
        until its commit is released, `released` once a release flow records
        it under `releases.<commit>` in the system bucket, and `deployed` when
        no file runs as before, including when a file has changed again
        since. Set only on a `committed` change whose target has
        `track_deployment` on.

    ChangeFile:
      type: object
      required: [path, diff]
      properties:
        path:
          type: string
        content:
          type: string
          nullable: true
          description: Proposed content; null deletes the file.
        previous:
          type: string
          nullable: true
          description: Deployed content when the change was proposed; null for a new file.
        diff:
          type: string
          description: Unified diff from `previous` to `content`.

    Change:
      type: object
      required: [id, target, title, status, proposedBy, createdAt, files, issues]
      properties:
        id:
          type: string
        target:
          type: string
          description: The `web.authoring.targets` entry every file of the change falls in.
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        proposedBy:
          type: string
          description: The user or machine key that proposed the change.
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds.
        updatedAt:
          type: integer
          format: int64
          description: When the change was proposed or last edited, epoch milliseconds.
        decidedBy:
          type: string
          description: The user who approved or rejected the change.
        decidedAt:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangeFile"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        result:
          type: object
          additionalProperties: true
          description: What the commit flow returned, `{commit, changed}`.
        error:
          type: string
          description: Why committing failed.
        deployment:
          $ref: "#/components/schemas/ChangeDeployment"
        stalled:
          type: boolean
          description: Committing ran past the `ack_timeout` of the commit flow's `inproc_endpoint`, so approving the change again retries it.
        templates:
          type: array
          description: The hub templates the change installs, updates or removes.
          items:
            $ref: "#/components/schemas/TemplateSource"

    ChangeSummary:
      type: object
      required: [id, target, title, status, proposedBy, createdAt, fileCount, paths]
      properties:
        paths:
          type: array
          description: Workspace paths the change touches.
          items:
            type: string
        id:
          type: string
        target:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        proposedBy:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        decidedAt:
          type: integer
          format: int64
          description: When the change was approved or rejected.
        fileCount:
          type: integer
        deployment:
          $ref: "#/components/schemas/ChangeDeployment"

    SessionMessage:
      type: object
      description: One message in an Agents chat session.
      required: [role, content, at]
      properties:
        role:
          type: string
          description: Message author — `user` or `assistant`.
        content:
          type: string
          description: The message text.
        at:
          type: integer
          format: int64
          description: When the message was sent, epoch milliseconds.
        steps:
          type: array
          description: Tool calls the agent ran while producing this message, in order.
          items:
            $ref: "#/components/schemas/ToolStep"
        pending:
          type: boolean
          description: The agent is still writing the message.
        error:
          type: string
          description: Why the agent's reply ended without finishing, e.g. the AI gateway failed.
        stopped:
          type: boolean
          description: The user stopped the agent's reply before it finished.

    SessionUpdate:
      type: object
      description: Body for `PATCH /api/agents/sessions/{id}`; fields left out stay as they are.
      properties:
        title:
          type: string
          description: The new title, not empty.
        folder:
          type: string
          description: |
            The caller's folder for the session, as `a/b`. Empty files
            it in no folder. Other users' folders don't change.

    ReplyRequest:
      type: object
      description: Body for `POST /api/agents/sessions/{id}/reply`.
      required: [content, model]
      properties:
        content:
          type: string
          description: The user's message.
        model:
          type: string
          description: The gateway model id of the agent that replies.

    Session:
      type: object
      description: A stored Agents chat session with its full history.
      required: [id, title, messages, updatedAt]
      properties:
        id:
          type: string
          description: Client-supplied session id (`[A-Za-z0-9_-]+`).
        title:
          type: string
          description: Human-readable session title.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        model:
          type: string
          description: The gateway model id last used for this session.
        origin:
          $ref: "#/components/schemas/SessionOrigin"
        unread:
          type: boolean
          description: |
            Whether the caller hasn't read the session since it changed.
            A flow that writes it sets `true`, so it is unread for everyone who
            hasn't read it since. Missing means read.
        folder:
          type: string
          description: |
            The folder the session is filed in, as `a/b`. A flow that
            writes the session can set it; each user can move it to
            their own folder, as `GET` returns it for them.
        updatedAt:
          type: integer
          format: int64
          description: Last write time, epoch milliseconds (server-stamped).

    SessionOrigin:
      type: string
      enum: [user, agent]
      description: |
        Who opened the session: the user in the chat, or a flow on an
        agent's behalf. Missing means `user`.

    SessionSummary:
      type: object
      description: A session without its messages, for the list view.
      required: [id, title, updatedAt, messageCount]
      properties:
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: integer
          format: int64
          description: Last write time, epoch milliseconds.
        messageCount:
          type: integer
          description: Number of messages in the session.
        origin:
          $ref: "#/components/schemas/SessionOrigin"
        unread:
          type: boolean
        folder:
          type: string
          description: The folder the caller filed the session in, as `a/b`.

    SessionUpsert:
      type: object
      description: |
        Body for `PUT /api/agents/sessions/{id}`. `id` and `updatedAt`
        are set by the server (path is authoritative, timestamp is
        server-stamped), so they are not part of this body. The writer has
        read the session.
      required: [title, messages]
      properties:
        title:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessage"
        model:
          type: string
          description: The gateway model id last used for this session.
        origin:
          $ref: "#/components/schemas/SessionOrigin"

    LogSpan:
      type: object
      description: One span in a log record's span chain, root-to-leaf.
      required: [name, fields]
      properties:
        name:
          type: string
          description: Span name (e.g. `flow.run`, `task.run`, `task.handle`).
        fields:
          type: array
          description: Fields declared on this span, flattened to strings.
          items:
            $ref: "#/components/schemas/KeyValue"

    KeyValue:
      type: object
      description: Ordered key/value pair. Kept as an array of these instead of a map so duplicate keys are preserved.
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string

    LogLevel:
      type: string
      description: Lowercased tracing level.
      enum: [info, warn, error, debug, trace]

    LogRecord:
      type: object
      description: |
        A single log line captured by the telemetry backend, wire-shape
        of the internal `StoredLog`. Framework consumers get span
        topology (`spans`) alongside event-level `fields` so they can
        classify records without parsing a flat attribute bag.
      required: [body, level, target, spans, fields]
      properties:
        body:
          type: string
          description: The tracing event's `message` field.
        level:
          $ref: "#/components/schemas/LogLevel"
        timestamp:
          type: string
          nullable: true
          format: date-time
          description: RFC 3339 timestamp when present in the source line.
        target:
          type: string
          description: The tracing `target` (usually the module path).
        spans:
          type: array
          description: Span chain from root to leaf. Empty for events emitted outside any span.
          items:
            $ref: "#/components/schemas/LogSpan"
        fields:
          type: array
          description: Fields declared on the event itself (not inherited from spans).
          items:
            $ref: "#/components/schemas/KeyValue"
